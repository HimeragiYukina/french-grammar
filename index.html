  "a2-pc-vs-imp": [ {q:"Je ___ (lire) quand on ___ (frapper) à la porte. <span class=hint>提示:背景 + 突发</span>", a:"Je lisais quand on a frappé à la porte.", note:"背景→imparfait;突发→passé composé。"}, {q:"Hier, il ___ (faire) froid, alors je ___ (rester) à la maison. <span class=hint>提示:天气描写 + 完成动作</span>", a:"Hier, il faisait froid, alors je suis resté à la maison.", note:"天气→imparfait;完成动作→passé composé(être)。"}, {q:"Quand j'___ (être) enfant, j'___ (aller) souvent à la mer ; une fois, j'___ (voir) un dauphin. <span class=hint>提示:状态/习惯 vs 一次性事件</span>", a:"Quand j'étais enfant, j'allais souvent à la mer ; une fois, j'ai vu un dauphin.", note:"考查习惯与一次性事件的对比:souvent → imparfait;une fois → passé composé。"}, {q:"Soudain, quelqu'un ___ (crier) pendant que nous ___ (dîner). <span class=hint>提示:突发 vs 正在进行</span>", a:"Soudain, quelqu'un a crié pendant que nous dînions.", note:"考查信号词:soudain → PC;正在进行的背景 → imparfait(dînions)。"} ],
  "a2-futur-simple": [ {q:"Demain, nous ___ (être) en vacances. <span class=hint>提示:简单将来时,词干 ser-</span>", a:"Demain, nous serons en vacances.", note:"être 将来词干 ser- + 词尾 -ons"}, {q:"L'année prochaine, j'___ (aller) au Japon. <span class=hint>提示:词干 ir-</span>", a:"L'année prochaine, j'irai au Japon.", note:"aller 将来词干 ir- + 词尾 -ai"}, {q:"Ce soir, ils ___ (regarder) le match à la télé. <span class=hint>提示:规则动词,原形作词干</span>", a:"Ce soir, ils regarderont le match à la télé.", note:"考查规则构成:regarder(原形词干)+ 词尾 -ont。"}, {q:"Tu ___ (attendre) devant la gare. <span class=hint>提示:-re 动词去 e</span>", a:"Tu attendras devant la gare.", note:"考查 -re 动词构成:attendre 去 e → attendr- + -as。"} ],
  "a2-cod": [ {q:"Tu connais cette chanson ? — Oui, je ___ connais. <span class=hint>提示:替代 cette chanson</span>", a:"Oui, je la connais.", note:"阴性单数直接宾语 → la,置于动词前。"}, {q:"Vous regardez les enfants ? — Oui, je ___ regarde. <span class=hint>提示:替代 les enfants</span>", a:"Oui, je les regarde.", note:"les 替代复数直接宾语,置于动词前"}, {q:"Tu aimes ce chanteur ? — Oui, je ___ aime beaucoup. <span class=hint>提示:元音前缩合</span>", a:"Oui, je l'aime beaucoup.", note:"考查元音前缩合:le → l'(aime 以元音开头)。"}, {q:"Vous m'entendez ? — Oui, je ___ entends bien. <span class=hint>提示:回答中替代『您』</span>", a:"Oui, je vous entends bien.", note:"考查第一/第二人称 COD:vous 作直接宾语,置于变位动词前。"} ],
  "a2-coi": [ {q:"Tu écris à ta sœur ? — Oui, je ___ écris. <span class=hint>提示:à + 人</span>", a:"Oui, je lui écris.", note:"à + 单数人 → lui,不分男女。"}, {q:"Il parle à ses collègues ? — Oui, il ___ parle. <span class=hint>提示:à + 复数人</span>", a:"Oui, il leur parle.", note:"à + 复数人 → leur(无 -s)。"}, {q:"Il vous téléphone souvent ? — Oui, il ___ téléphone tous les jours. <span class=hint>提示:回答中替代『我们』</span>", a:"Oui, il nous téléphone tous les jours.", note:"考查第一/第二人称 COI:téléphoner à + 人 → nous,置于动词前。"} ],
  "a2-en": [ {q:"Tu bois de l'eau ? — Oui, j'___ bois. <span class=hint>提示:替代部分冠词宾语</span>", a:"Oui, j'en bois.", note:"en 替代 de + 名词的宾语,放动词前"}, {q:"Combien de voitures as-tu ? — J'___ ai deux. <span class=hint>提示:数量,en 保留数词</span>", a:"J'en ai deux.", note:"带数量时数词 deux 保留。"}, {q:"Vous parlez de ce problème ? — Oui, nous ___ parlons. <span class=hint>提示:de + 物</span>", a:"Oui, nous en parlons.", note:"考查 en 替代 de + 物:parler de ce problème → en。"}, {q:"Il mange des fruits ? — Oui, il ___ mange beaucoup. <span class=hint>提示:数量副词保留</span>", a:"Oui, il en mange beaucoup.", note:"考查 en 替代不定冠词宾语,数量副词 beaucoup 保留。"} ],
  "a2-y": [ {q:"Tu vas au cinéma ce soir ? — Oui, j'___ vais. <span class=hint>提示:à + 地点</span>", a:"Oui, j'y vais.", note:"y 替代 à + 地点:j'y vais"}, {q:"Elle pense à ses vacances → Elle ___ pense. <span class=hint>提示:à + 物</span>", a:"Elle y pense.", note:"penser à + 物 → y;à + 人则用 lui。"}, {q:"Tu restes chez toi ce week-end ? — Oui, j'___ reste. <span class=hint>提示:地点状语</span>", a:"Oui, j'y reste.", note:"考查 y 替代地点状语:chez toi → y(不限于 à + 地点)。"}, {q:"Tu penses à ta mère ? — Oui, je pense ___ . <span class=hint>提示:à + 人,不用 y</span>", a:"Oui, je pense à elle.", note:"考查易错点:penser à + 人保留重读代词(à elle),不能用 y。"} ],
  "a2-pronominaux": [ {q:"Le matin, je ___ (se lever) à six heures. <span class=hint>提示:代词式动词现在时</span>", a:"Le matin, je me lève à six heures.", note:"反身代词 me 跟主语一致。"}, {q:"Hier, elle ___ (se coucher) très tard. <span class=hint>提示:复合过去时用 être</span>", a:"Hier, elle s'est couchée très tard.", note:"用 être,过去分词配合主语 → couchée。"}, {q:"Marie et moi, nous ___ (s'écrire) souvent. <span class=hint>提示:相互动作</span>", a:"Marie et moi, nous nous écrivons souvent.", note:"考查相互用法:nous nous écrivons = 互相写信。"}, {q:"Tu ___ (se souvenir) de ce voyage ? <span class=hint>提示:固定代词式动词</span>", a:"Tu te souviens de ce voyage ?", note:"考查固定用法:se souvenir de,反身代词 te 跟主语 tu 一致。"}, {q:"Le week-end, je ___ (ne pas se lever) tôt. <span class=hint>提示:否定的位置</span>", a:"Le week-end, je ne me lève pas tôt.", note:"考查否定:ne + 反身代词 + 动词 + pas。"} ],
  "a2-imperatif": [ {q:"(à un ami) ___ (parler) plus lentement ! <span class=hint>提示:tu 命令式,-er 去 -s</span>", a:"Parle plus lentement !", note:"第一组动词 tu 命令式去 -s。"}, {q:"(à un ami) Tu es fatigué ? ___ (se reposer) ! <span class=hint>提示:肯定命令,te → toi</span>", a:"Repose-toi !", note:"肯定命令代词后置,te → toi。"}, {q:"(à des élèves) ___ (ne pas ouvrir) vos livres ! <span class=hint>提示:vous 的否定命令</span>", a:"N'ouvrez pas vos livres !", note:"考查否定命令:ne + 动词 + pas,vous 形式,主语省略。"}, {q:"(à un ami) ___ (ne pas se coucher) trop tard ! <span class=hint>提示:代词式否定命令,代词在动词前</span>", a:"Ne te couche pas trop tard !", note:"考查否定命令代词前置:te 回到动词前,tu 命令式仍去 -s。"}, {q:"___ (être, nous) patients ! <span class=hint>提示:être 的命令式不规则</span>", a:"Soyons patients !", note:"考查 nous 命令式及 être 的不规则形式 soyons。"} ],
  "a2-comparatif": [ {q:"Cette voiture est ___ chère ___ l'autre. (= +) <span class=hint>提示:优等比较</span>", a:"Cette voiture est plus chère que l'autre.", note:"优等比较:plus + 形容词 + que"}, {q:"Ton idée est ___ que la mienne. (bon, = +) <span class=hint>提示:bon 的优等比较不规则</span>", a:"Ton idée est meilleure que la mienne.", note:"bon → meilleur(e),不能说 plus bon。"}, {q:"Mon frère est ___ âgé ___ moi : nous avons le même âge. (= 一样) <span class=hint>提示:等同比较</span>", a:"Mon frère est aussi âgé que moi : nous avons le même âge.", note:"考查等同比较:aussi + 形容词 + que。"}, {q:"Ce café est ___ cher ___ l'autre. (= −) <span class=hint>提示:劣等比较</span>", a:"Ce café est moins cher que l'autre.", note:"考查劣等比较:moins + 形容词 + que。"}, {q:"Il a ___ travail ___ moi. (= +, 名词) <span class=hint>提示:名词比较用 de</span>", a:"Il a plus de travail que moi.", note:"考查名词数量比较:plus de + 名词 + que。"}, {q:"Elle cuisine ___ que sa sœur. (bien → 比较级) <span class=hint>提示:副词 bien 的不规则比较级</span>", a:"Elle cuisine mieux que sa sœur.", note:"考查 bien → mieux(副词),区别于 bon → meilleur(形容词)。"} ],
  "a2-superlatif": [ {q:"C'est ___ grand monument de la ville. (= 最) <span class=hint>提示:le plus + 形容词</span>", a:"C'est le plus grand monument de la ville.", note:"最高级:le plus + 形容词"}, {q:"Paris est ___ belle ville ___ monde. (= 世界上最美) <span class=hint>提示:后置冠词重复;『在…中』用 de</span>", a:"Paris est la plus belle ville du monde.", note:"du monde = de + le monde。"}, {q:"C'est la solution ___ compliquée : choisissons-la ! (= 最不) <span class=hint>提示:劣等最高级</span>", a:"C'est la solution la moins compliquée : choisissons-la !", note:"考查劣等最高级 la moins + 形容词,后置形容词冠词重复。"}, {q:"C'est elle qui danse ___ de la classe. (bien → 最高级) <span class=hint>提示:副词的不规则最高级</span>", a:"C'est elle qui danse le mieux de la classe.", note:"考查 bien → le mieux(副词最高级,冠词恒为 le);范围用 de。"} ],
  "a2-qui-que": [ {q:"C'est une amie ___ travaille avec moi. <span class=hint>提示:从句缺主语</span>", a:"C'est une amie qui travaille avec moi.", note:"后接动词 → qui。"}, {q:"Voici le gâteau ___ ma mère a préparé. <span class=hint>提示:从句缺直接宾语</span>", a:"Voici le gâteau que ma mère a préparé.", note:"后接主语 → que。"}, {q:"La chanson ___ elle écoute est belle. <span class=hint>提示:元音前注意缩合</span>", a:"La chanson qu'elle écoute est belle.", note:"考查缩合:从句已有主语 elle → 用 que,元音前缩为 qu'。"} ],
  "a2-ou-relatif": [ {q:"Voici la maison ___ j'ai grandi. <span class=hint>提示:地点</span>", a:"Voici la maison où j'ai grandi.", note:"où 引导地点关系从句"}, {q:"Je me souviens du jour ___ nous nous sommes rencontrés. <span class=hint>提示:时间也用它</span>", a:"Je me souviens du jour où nous nous sommes rencontrés.", note:"表时间的「那天」用 où。"}, {q:"Je n'oublierai jamais l'année ___ j'ai eu mon bac. <span class=hint>提示:时间,不用 quand</span>", a:"Je n'oublierai jamais l'année où j'ai eu mon bac.", note:"考查时间用法:l'année où…,不能用 quand。"} ],
  "a2-quantite": [ {q:"Dans cette ville, il y a ___ touristes. (beaucoup) <span class=hint>提示:数量副词 + de</span>", a:"Dans cette ville, il y a beaucoup de touristes.", note:"beaucoup de(无冠词),不是 beaucoup des。"}, {q:"Je voudrais ___ eau, s'il vous plaît. (une bouteille) <span class=hint>提示:量词 + de</span>", a:"Je voudrais une bouteille d'eau, s'il vous plaît.", note:"元音前缩 d'。"}, {q:"J'ai ___ travail cette semaine. (trop) <span class=hint>提示:数量副词 + de,无冠词</span>", a:"J'ai trop de travail cette semaine.", note:"考查数量副词 trop de:直接接名词,不加冠词。"}, {q:"Tu as ___ argent pour le bus ? (assez) <span class=hint>提示:元音前缩合</span>", a:"Tu as assez d'argent pour le bus ?", note:"考查 assez de + 元音开头名词 → assez d'argent。"} ],
  "a2-temps-prep": [ {q:"J'habite à Lyon ___ trois ans. (自三年前至今) <span class=hint>提示:持续到现在 + 现在时</span>", a:"J'habite à Lyon depuis trois ans.", note:"depuis + 现在时(中文「了」,法语现在时)。"}, {q:"Le film commence ___ dix minutes. (十分钟后) <span class=hint>提示:将来「…之后」</span>", a:"Le film commence dans dix minutes.", note:"dans + 时间 = 将来『…之后』"}, {q:"Nous avons voyagé ___ trois semaines l'été dernier. (整整三周) <span class=hint>提示:已结束的时长</span>", a:"Nous avons voyagé pendant trois semaines l'été dernier.", note:"考查 pendant:表示已完成动作的持续时长,配过去时。"}, {q:"Elle a déménagé ___ deux ans. (两年前) <span class=hint>提示:『…之前』</span>", a:"Elle a déménagé il y a deux ans.", note:"考查 il y a + 时间 = …之前,配过去时,此处不是『有』。"} ],
  "a2-politesse": [ {q:"Au café : ___ un thé, s'il vous plaît. (vouloir, je,礼貌) <span class=hint>提示:条件式</span>", a:"Je voudrais un thé, s'il vous plaît.", note:"je voudrais 比 je veux 更礼貌。"}, {q:"___ m'aider, s'il vous plaît ? (pouvoir, vous,礼貌请求) <span class=hint>提示:条件式倒装</span>", a:"Pourriez-vous m'aider, s'il vous plaît ?", note:"pouvoir 条件式倒装 pourriez-vous,礼貌请求"}, {q:"___ (aimer, je) réserver une table pour deux, s'il vous plaît. <span class=hint>提示:条件式,委婉愿望</span>", a:"J'aimerais réserver une table pour deux, s'il vous plaît.", note:"考查 j'aimerais 表委婉的愿望/请求。"} ],
  "b1-pqp": [ {q:"Quand je suis arrivé à la gare, le train ___ déjà ___ (partir). (到达前火车已开走)", a:"Quand je suis arrivé à la gare, le train était déjà parti.", note:"到达前已发生→愈过去时,partir 用 être:était parti"}, {q:"Elle nous a raconté ce qu'elle ___ (voir) la veille. (转述之前看到的)", a:"Elle nous a raconté ce qu'elle avait vu la veille.", note:"转述之前发生的事→avait vu"}, {q:"Si nous ___ (réserver) plus tôt, nous aurions eu des places. (si 假设第三型:愈过去时)", a:"Si nous avions réservé plus tôt, nous aurions eu des places.", note:"考查 si + 愈过去时(第三型假设):avoir 的 imparfait + 过去分词 → avions réservé。"} ],
  "b1-cond-present": [ {q:"___ (vouloir, je) un café, s'il vous plaît. (礼貌)", a:"Je voudrais un café, s'il vous plaît.", note:"futur 词干 voudr- + imparfait 词尾。"}, {q:"Si j'avais de l'argent, j'___ (acheter) une maison. (假设的结果)", a:"Si j'avais de l'argent, j'achèterais une maison.", note:"si + imparfait,主句用条件式现在时"}, {q:"Selon la presse, le ministre ___ (être) malade. (未经证实的传闻)", a:"Selon la presse, le ministre serait malade.", note:"条件式表未经证实的传闻:serait"}, {q:"Un jour, j'___ (aimer) visiter le Maroc. (愿望)", a:"Un jour, j'aimerais visiter le Maroc.", note:"考查条件式表愿望:j'aimerais + 原形,语气委婉。"} ],
  "b1-cond-passe": [ {q:"J'___ (devoir) partir plus tôt. (后悔:本该)", a:"J'aurais dû partir plus tôt.", note:"aurais dû + 原形 = 本该(后悔)"}, {q:"Si tu m'avais prévenu, je ___ (venir) t'aider. (过去未实现)", a:"Si tu m'avais prévenu, je serais venu t'aider.", note:"venir 用 être,配合主语。"}, {q:"Tu ___ (pouvoir) me prévenir ! (责备:你本可以…)", a:"Tu aurais pu me prévenir !", note:"考查条件式过去表责备:aurais pu + 原形 = 本可以,常用于抱怨对方。"} ],
  "b1-subj-present": [ {q:"Il faut que tu ___ (faire) tes devoirs ce soir. (必要→虚拟)", a:"Il faut que tu fasses tes devoirs ce soir.", note:"faire 不规则:fasse。"}, {q:"Je veux que vous ___ (être) à l'heure demain. (意愿→虚拟)", a:"Je veux que vous soyez à l'heure demain.", note:"être 不规则:soyez。"}, {q:"Il est nécessaire que vous ___ (finir) ce travail avant vendredi. (规则构成)", a:"Il est nécessaire que vous finissiez ce travail avant vendredi.", note:"考查规则虚拟式构成:ils finissent → 词干 finiss- + -iez。"}, {q:"Il faut que tu ___ (aller) chez le médecin. (不规则动词)", a:"Il faut que tu ailles chez le médecin.", note:"考查不规则虚拟式:aller → que tu ailles。"} ],
  "b1-subj-declencheurs": [ {q:"Bien qu'il ___ (être) fatigué, il continue. (bien que→虚拟)", a:"Bien qu'il soit fatigué, il continue.", note:"bien que 必接虚拟式:soit"}, {q:"J'espère qu'il ___ (venir) à la fête. (espérer que→直陈式!)", a:"J'espère qu'il viendra à la fête.", note:"espérer que 接直陈,不是虚拟。"}, {q:"Je reste jusqu'à ce que tu ___ (revenir). (jusqu'à ce que→虚拟)", a:"Je reste jusqu'à ce que tu reviennes.", note:"jusqu'à ce que 接虚拟式:reviennes"}, {q:"Elle souhaite que nous ___ (venir) à son mariage. (意愿→虚拟)", a:"Elle souhaite que nous venions à son mariage.", note:"考查意愿类触发词:souhaiter que + 虚拟式,que nous venions。"}, {q:"Je suis triste que tu ___ (partir) si tôt. (情感→虚拟)", a:"Je suis triste que tu partes si tôt.", note:"考查情感类触发词:être triste que + 虚拟式。"}, {q:"Nous doutons que ce ___ (être) vrai. (怀疑→虚拟)", a:"Nous doutons que ce soit vrai.", note:"考查怀疑类触发词:douter que + 虚拟式。"}, {q:"Il est important que chacun ___ (pouvoir) s'exprimer. (判断→虚拟)", a:"Il est important que chacun puisse s'exprimer.", note:"考查必要/判断类:il est important que + 虚拟式,pouvoir → puisse。"} ],
  "b1-si": [ {q:"Si j'___ (avoir) le temps demain, je ___ (venir) te voir. (①真实:现在时→将来时)", a:"Si j'ai le temps demain, je viendrai te voir.", note:"型①真实假设:si + 现在时,主句将来时"}, {q:"Si j'___ (être) riche, je ___ (voyager) partout. (②现在非真实:未完成→条件式现在)", a:"Si j'étais riche, je voyagerais partout.", note:"si 后绝不用条件式。"}, {q:"Si j'___ (savoir) la vérité, je ___ (ne rien dire). (③过去非真实:愈过去→条件式过去)", a:"Si j'avais su la vérité, je n'aurais rien dit.", note:"型③过去非真实:si + 愈过去,主句条件式过去"} ],
  "b1-discours-indirect": [ {q:"Il dit : « Je suis fatigué. » → Il dit ___ il est fatigué. (陈述句)", a:"Il dit qu'il est fatigué.", note:"转述陈述句用 que 引导"}, {q:"Elle me demande : « Tu viens ? » → Elle me demande ___ je viens. (是非问)", a:"Elle me demande si je viens.", note:"转述是非问用 si 引导"}, {q:"« Qu'est-ce que tu fais ? » → Il demande ___ je fais. (特殊疑问)", a:"Il demande ce que je fais.", note:"qu'est-ce que → ce que。"}, {q:"« Attendez-moi ! » → Elle nous dit ___ l'attendre. (命令)", a:"Elle nous dit de l'attendre.", note:"考查命令句的转述:dire de + 原形。"}, {q:"« Où travailles-tu ? » → Il me demande ___ je travaille. (特殊疑问,保留疑问词)", a:"Il me demande où je travaille.", note:"考查疑问词保留:où 直接引导从句,主谓不倒装。"} ],
  "b1-passif": [ {q:"La police a arrêté le voleur. → Le voleur ___ (arrêter,被动) par la police. (复合过去时被动)", a:"Le voleur a été arrêté par la police.", note:"被动 = être 变复合过去 + 过去分词:a été arrêté"}, {q:"Tout le monde aime ce professeur. → Ce professeur est aimé ___ tout le monde. (情感用 de)", a:"Ce professeur est aimé de tout le monde.", note:"感受/状态常用 de 而非 par。"}, {q:"On construit ces maisons en bois. → Ces maisons ___ (construire,被动现在时) en bois. (分词配合)", a:"Ces maisons sont construites en bois.", note:"考查被动分词的配合:主语阴性复数 → construites。"}, {q:"On annoncera les résultats demain. → Les résultats ___ (annoncer,被动将来时) demain.", a:"Les résultats seront annoncés demain.", note:"考查时态由 être 承担:将来时被动 seront annoncés,分词配合复数。"} ],
  "b1-double-pronoms": [ {q:"Il me donne le livre. → Il ___ donne. (me + le)", a:"Il me le donne.", note:"me/te 在 le/la/les 之前:me le"}, {q:"Tu donnes les clés à Paul ? → Tu ___ donnes ? (les + lui)", a:"Tu les lui donnes ?", note:"le/la/les 在 lui/leur 之前:les lui"}, {q:"Donne le livre à moi ! → ___ ! (肯定命令式)", a:"Donne-le-moi !", note:"肯定命令语序:le 在 moi 之前。"}, {q:"Tu m'apportes des fleurs ? → Tu ___ apportes ? (me + en)", a:"Tu m'en apportes ?", note:"考查 en 殿后:me 在前缩合为 m'en,紧贴动词。"}, {q:"Il retrouve ses amis au café. → Il ___ retrouve. (les + y)", a:"Il les y retrouve.", note:"考查 y 的位置:在 le/la/les 之后、en 之前。"} ],
  "b1-possessifs-pron": [ {q:"C'est ta voiture ? — Non, c'est ___ (à elle). (她的)", a:"Non, c'est la sienne.", note:"配合 voiture 阴性。"}, {q:"Je préfère mon vélo ___ (à + le tien). (à 与冠词缩合)", a:"Je préfère mon vélo au tien.", note:"à + le tien → au tien。"}, {q:"Nos voisins ont un jardin plus grand que ___ (à nous). (我们的)", a:"Nos voisins ont un jardin plus grand que le nôtre.", note:"考查基本替代与配合:jardin 阳性单数 → le nôtre,注意长音符 ô。"} ],
  "b1-demonstratifs-pron": [ {q:"Quel livre veux-tu ? — ___ (celui + de) Marie. (这个 + 所属)", a:"Celui de Marie.", note:"celui de + 名词 表所属"}, {q:"___ (ceux + qui) veulent partir peuvent le faire. (那些 + 从句)", a:"Ceux qui veulent partir peuvent le faire.", note:"ceux qui + 从句 = 那些…的人"}, {q:"Quelle veste choisis-tu ? — ___ , à droite. (远指,与 veste 配合)", a:"Celle-là, à droite.", note:"考查 -là 远指:veste 阴性单数 → celle-là。"}, {q:"Il pleut depuis trois jours ; ___ m'énerve. (中性,指整个情况)", a:"Il pleut depuis trois jours ; cela m'énerve.", note:"考查中性代词 cela:指代前面整件事,不与名词配合。"} ],
  "b1-dont": [ {q:"Voici le livre ___ je t'ai parlé. (parler de → ?)", a:"Voici le livre dont je t'ai parlé.", note:"parler de → 关系代词用 dont"}, {q:"C'est l'outil ___ j'ai besoin. (avoir besoin de → ?)", a:"C'est l'outil dont j'ai besoin.", note:"avoir besoin de → dont"}, {q:"Je connais un homme ___ la voiture est rouge. (所属:他的车)", a:"Je connais un homme dont la voiture est rouge.", note:"语序:dont + 主语 + 动词。"}, {q:"Elle a écrit dix romans, ___ trois sont très connus. (其中三部)", a:"Elle a écrit dix romans, dont trois sont très connus.", note:"考查 dont 表数量:dont + 数词 = 其中。"}, {q:"C'est un résultat ___ nous sommes très fiers. (être fier de)", a:"C'est un résultat dont nous sommes très fiers.", note:"考查形容词 + de(fier de)的补语 → dont。"} ],
  "b1-gerondif": [ {q:"Il chante ___ (travailler). (同时:一边…一边)", a:"Il chante en travaillant.", note:"en + 现在分词。"}, {q:"___ (chercher) bien, tu trouveras. (条件:好好找的话)", a:"En cherchant bien, tu trouveras.", note:"en + 现在分词表条件:好好找的话"}, {q:"Comment a-t-il perdu du poids ? — ___ (faire) du sport tous les jours. (方式)", a:"En faisant du sport tous les jours.", note:"考查副动词表方式:回答 comment,en + faisant。"}, {q:"Tu progresseras ___ (être) plus attentif en classe. (条件;分词不规则)", a:"Tu progresseras en étant plus attentif en classe.", note:"考查不规则现在分词:être → étant。"} ],
  "b1-negations": [ {q:"Je bois seulement de l'eau. → Je ___ bois ___ de l'eau. (ne…que,冠词不变!)", a:"Je ne bois que de l'eau.", note:"ne…que 是限制,保留 de l'eau。"}, {q:"Il y a quelqu'un ? — Non, il ___ y a ___. (没有人)", a:"Non, il n'y a personne.", note:"『没有人』用 ne…personne"}, {q:"Avant, il fumait, mais maintenant il ___ fume ___. (不再)", a:"Avant, il fumait, mais maintenant il ne fume plus.", note:"考查 ne…plus:不再做过去做的事。"}, {q:"Tu vas souvent au théâtre ? — Non, je ___ y vais ___. (从不)", a:"Non, je n'y vais jamais.", note:"考查 ne…jamais:从不。"}, {q:"Tu as entendu quelque chose ? — Non, je ___ ai ___ entendu. (什么都没)", a:"Non, je n'ai rien entendu.", note:"考查 ne…rien:复合时态中 rien 置于助动词与分词之间。"}, {q:"Il y a des erreurs ? — Non, il n'y a ___ erreur. (没有任何,配合阴性)", a:"Non, il n'y a aucune erreur.", note:"考查 ne…aucun(e):与名词性数配合,名词保持单数。"}, {q:"___ ne peut m'arrêter. (什么都不能,作主语)", a:"Rien ne peut m'arrêter.", note:"考查 rien 作主语:Rien ne + 动词,ne 不能省。"} ],
  "b1-connecteurs-base": [ {q:"Je révise beaucoup ___ j'ai un examen lundi. (原因)", a:"Je révise beaucoup parce que j'ai un examen lundi.", note:"表原因用 parce que"}, {q:"Je t'explique tout ___ tu ___ (comprendre). (目的:pour que→虚拟)", a:"Je t'explique tout pour que tu comprennes.", note:"pour que + 虚拟式。"}, {q:"___ tu connais déjà la réponse, pourquoi me demandes-tu ? (既然,用 puisque)", a:"Puisque tu connais déjà la réponse, pourquoi me demandes-tu ?", note:"考查 puisque:引出双方已知的原因。"}, {q:"___ il faisait beau, nous avons déjeuné dehors. (由于,放句首,用 comme)", a:"Comme il faisait beau, nous avons déjeuné dehors.", note:"考查 comme:表原因须放句首。"}, {q:"Prends ton parapluie, ___ il va pleuvoir. (原因,书面,用 car)", a:"Prends ton parapluie, car il va pleuvoir.", note:"考查 car:书面原因连词,不放句首。"}, {q:"Elle parle trois langues, ___ elle a vite trouvé un poste. (结果,用 c'est pourquoi)", a:"Elle parle trois langues, c'est pourquoi elle a vite trouvé un poste.", note:"考查结果连词 c'est pourquoi:所以/正因如此。"}, {q:"Je me lève tôt ___ (avoir) le temps de courir. (目的,同主语)", a:"Je me lève tôt pour avoir le temps de courir.", note:"考查同主语目的:pour + 原形,不用 pour que。"} ],
  "b2-subj-passe": [ {q:"Je suis ravi que vous ___ (terminer) le projet avant la réunion. (已完成→虚拟式过去)", a:"Je suis ravi que vous ayez terminé le projet avant la réunion.", note:"主句前已完成→虚拟式过去:ayez terminé"}, {q:"Bien qu'elle ___ (partir) tôt, elle a manqué son train. (已发生→虚拟式过去)", a:"Bien qu'elle soit partie tôt, elle a manqué son train.", note:"partir 用 être,分词配合阴性。"}, {q:"Il faut que tu ___ (rendre) ton dossier vendredi ; je suis surpris que tu l'___ déjà ___ (rendre). (未完成→虚拟现在;已完成→虚拟过去)", a:"Il faut que tu rendes ton dossier vendredi ; je suis surpris que tu l'aies déjà rendu.", note:"考查虚拟式现在与过去的对比:同时/将来用 rendes,先于主句完成用 aies rendu。"} ],
  "b2-mode-choix": [ {q:"Je suis sûr qu'il ___ (avoir) raison. (肯定→直陈)", a:"Je suis sûr qu'il a raison.", note:"être sûr que 表肯定→直陈式"}, {q:"Je ne crois pas qu'il ___ (avoir) raison. (否定→虚拟)", a:"Je ne crois pas qu'il ait raison.", note:"ne pas croire que 表怀疑→虚拟式 ait"}, {q:"À ta place, je ___ (refuser) cette proposition. (假设→条件式)", a:"À ta place, je refuserais cette proposition.", note:"考查条件式:假设『换作是你』的情景,用条件式现在委婉表达建议。"}, {q:"Il est possible que nous ___ (devoir) reporter la réunion. (il est possible que→虚拟)", a:"Il est possible que nous devions reporter la réunion.", note:"考查非人称结构:il est possible que 接虚拟式,而 il est probable que 接直陈式。"} ],
  "b2-concordance": [ {q:"« Je finirai demain. » → Il a dit qu'il ___ . (主句过去→后移 + 时间词)", a:"Il a dit qu'il finirait le lendemain.", note:"futur → conditionnel;demain → le lendemain。"}, {q:"« J'ai vu ce film hier. » → Elle a expliqué qu'elle ___ . (后移 + 时间词)", a:"Elle a expliqué qu'elle avait vu ce film la veille.", note:"passé composé → plus-que-parfait;hier → la veille。"}, {q:"« Je travaille aujourd'hui. » → Il a dit qu'il ___ . (现在时后移 + 时间词)", a:"Il a dit qu'il travaillait ce jour-là.", note:"考查现在时→未完成过去:travaille→travaillait;aujourd'hui→ce jour-là。"}, {q:"« Nous aurons déménagé avant l'été. » → Ils ont annoncé qu'ils ___ avant l'été. (先将来→条件式过去)", a:"Ils ont annoncé qu'ils auraient déménagé avant l'été.", note:"考查先将来→条件式过去:aurons déménagé→auraient déménagé。"} ],
  "b2-participe-present": [ {q:"Remplacez la relative : Les candidats <b>qui possèdent</b> un diplôme… → Les candidats ___ un diplôme… (现在分词)", a:"Les candidats possédant un diplôme.", note:"qui possèdent → possédant。"}, {q:"« Comme le magasin était fermé, nous sommes rentrés. » → proposition participiale : ___ , nous sommes rentrés. (自带主语)", a:"Le magasin étant fermé, nous sommes rentrés.", note:"分词从句自带主语:le magasin étant fermé"}, {q:"Remplacez par un participe présent (原因) : Comme elle connaissait bien la ville, elle nous a guidés. → ___ bien la ville, elle nous a guidés.", a:"Connaissant bien la ville, elle nous a guidés.", note:"考查现在分词表原因:comme + 未完成过去 → 现在分词,主语同为 elle。"}, {q:"Participe ou adjectif ? C'est une réunion très ___ (fatiguer,形容词性,要配合).", a:"C'est une réunion très fatigante.", note:"考查形容词性 -ant:作形容词需配合阴性(fatigante),与不变的现在分词不同。"} ],
  "b2-se-faire": [ {q:"On lui a volé sa voiture. → Il ___ sa voiture. (se faire,强调受害者)", a:"Il s'est fait voler sa voiture.", note:"se faire 中 fait 永不配合。"}, {q:"On a refusé l'accès à cette journaliste. → Cette journaliste ___ l'accès. (se voir + 原形)", a:"Cette journaliste s'est vu refuser l'accès.", note:"vu 不配合。"}, {q:"Attention aux pickpockets : tu vas ___ ton téléphone ! (se faire + voler,原形结构)", a:"Attention aux pickpockets : tu vas te faire voler ton téléphone !", note:"考查 se faire+原形在复合结构中的用法:aller + se faire voler,反身代词随主语变为 te。"} ],
  "b2-relatifs-composes": [ {q:"C'est un collègue. Je travaille avec lui. → C'est le collègue ___ je travaille. (介词+指人)", a:"C'est le collègue avec qui je travaille.", note:"介词后指人优先用 qui。"}, {q:"Voilà l'objectif. Je tiens à cet objectif. → Voilà l'objectif ___ je tiens. (tenir à + 物)", a:"Voilà l'objectif auquel je tiens.", note:"à + lequel → auquel。"}, {q:"C'est la rivière. J'habite au bord de cette rivière. → C'est la rivière ___ j'habite. (短语以 de 结尾)", a:"C'est la rivière au bord de laquelle j'habite.", note:"au bord de → de laquelle,不用 dont。"}, {q:"J'ai posé mes clés sur cette table. → La table ___ j'ai posé mes clés est dans l'entrée. (poser sur + 物)", a:"La table sur laquelle j'ai posé mes clés est dans l'entrée.", note:"考查介词+lequel 指物:sur + 阴性单数先行词 → sur laquelle。"}, {q:"Je m'occupe de ce dossier. → Voilà le dossier ___ je m'occupe. (单个 de,别用 duquel)", a:"Voilà le dossier dont je m'occupe.", note:"考查单 de→dont:s'occuper de 的补语由单独 de 引导,用 dont 而非 duquel。"}, {q:"Elle rêve de réussir son concours. → Réussir son concours, c'est ___ elle rêve. (中性先行词)", a:"Réussir son concours, c'est ce dont elle rêve.", note:"考查中性形式:rêver de + 整体概念 → ce dont。"}, {q:"Elle a invité dix amis, ___ trois musiciens. (parmi + 指人)", a:"Elle a invité dix amis, parmi lesquels trois musiciens.", note:"考查 parmi 后指人也用 lesquels:不说 parmi qui。"} ],
  "b2-mise-relief": [ {q:"Paul a cassé le vase. → ___ a cassé le vase. (强调主语→c'est…qui)", a:"C'est Paul qui a cassé le vase.", note:"强调主语用 c'est…qui"}, {q:"Je veux la justice. → ___ , c'est la justice. (ce que…, c'est…)", a:"Ce que je veux, c'est la justice.", note:"强调宾语用 ce que…, c'est…"}, {q:"J'ai rencontré Léa à Lyon. → C'est à Lyon ___ j'ai rencontré Léa. (强调地点)", a:"C'est à Lyon que j'ai rencontré Léa.", note:"考查 c'est…que:强调主语以外的成分(地点状语)用 que。"}, {q:"Son honnêteté me plaît. → ___ me plaît, ___ son honnêteté. (ce qui…, c'est…)", a:"Ce qui me plaît, c'est son honnêteté.", note:"考查 ce qui…, c'est…:ce qui 作从句主语,重点后置。"} ],
  "b2-nominalisation": [ {q:"Les températures ont baissé. → ___ des températures. (动词→名词)", a:"La baisse des températures.", note:"baisser → la baisse。"}, {q:"Le ministre a démissionné. → ___ du ministre. (-ion)", a:"La démission du ministre.", note:"démissionner → la démission。"}, {q:"Le tourisme se développe rapidement. → ___ rapide du tourisme. (-ment)", a:"Le développement rapide du tourisme.", note:"考查 -ment 名词化:se développer → le développement,副词 rapidement 变形容词 rapide。"}, {q:"Ce quartier est pauvre. → ___ de ce quartier. (形容词→名词 -té)", a:"La pauvreté de ce quartier.", note:"考查形容词名词化:pauvre → la pauvreté。"} ],
  "b2-futur-anterieur": [ {q:"Quand tu ___ (lire) ce livre, tu me le rendras. (从句先完成→先将来)", a:"Quand tu auras lu ce livre, tu me le rendras.", note:"quand 从句先完成→先将来时 auras lu"}, {q:"Dès qu'elle ___ (rentrer), nous dînerons. (先完成,être 助动词)", a:"Dès qu'elle sera rentrée, nous dînerons.", note:"être 简单将来 + 分词配合阴性。"}, {q:"Une fois que vous ___ (prendre) votre décision, prévenez-moi. (一旦…就:先完成→先将来)", a:"Une fois que vous aurez pris votre décision, prévenez-moi.", note:"考查 une fois que + 先将来:prendre→pris,主句用命令式。"} ],
  "b2-opposition-concession": [ {q:"___ il ___ (être) très qualifié, il n'a pas obtenu le poste. (尽管→bien que+虚拟)", a:"Bien qu'il soit très qualifié, il n'a pas obtenu le poste.", note:"让步 bien que + 虚拟式 soit"}, {q:"___ ses efforts, il a échoué. (malgré + 名词)", a:"Malgré ses efforts, il a échoué.", note:"malgré 后跟名词,不能跟句子。"}, {q:"Il ___ crier, personne ne l'entend. (avoir beau + 原形)", a:"Il a beau crier, personne ne l'entend.", note:"avoir beau + 原形 = 尽管…也徒劳"}, {q:"___ tu n'es pas d'accord, écoute-le jusqu'au bout. (即使→même si+直陈式)", a:"Même si tu n'es pas d'accord, écoute-le jusqu'au bout.", note:"考查 même si:后接直陈式,不能用虚拟式。"}, {q:"Ma sœur adore la ville, ___ je préfère la campagne. (对立:用 alors que)", a:"Ma sœur adore la ville, alors que je préfère la campagne.", note:"考查对立 alors que:并列对照两个事实,后接直陈式。"}, {q:"Ce restaurant est cher ; ___ , il est toujours plein. (然而:用 pourtant)", a:"Ce restaurant est cher ; pourtant, il est toujours plein.", note:"考查让步副词 pourtant:结果与预期相反。"}, {q:"Il est faible en maths ; ___ , il excelle en langues. (反之:用 en revanche)", a:"Il est faible en maths ; en revanche, il excelle en langues.", note:"考查对立 en revanche:书面上比 par contre 更受推崇。"} ],
  "b2-cause-consequence": [ {q:"Il a ___ insisté ___ j'ai fini par accepter. (如此…以致→tellement…que)", a:"Il a tellement insisté que j'ai fini par accepter.", note:"tellement…que 如此…以致"}, {q:"Le match est reporté ___ fortes pluies. (由于+名词,正式)", a:"Le match est reporté en raison des fortes pluies.", note:"en raison de + les → des。"}, {q:"___ les magasins sont fermés le dimanche, faisons les courses aujourd'hui. (鉴于:étant donné que)", a:"Étant donné que les magasins sont fermés le dimanche, faisons les courses aujourd'hui.", note:"考查正式原因连词 étant donné que:引出双方已知的事实。"}, {q:"___ la générosité de nos donateurs, le projet a vu le jour. (正面原因)", a:"Grâce à la générosité de nos donateurs, le projet a vu le jour.", note:"考查 grâce à:结果是好事用 grâce à,坏事才用 à cause de。"}, {q:"___ temps, nous avons renoncé à visiter le musée. (由于缺乏)", a:"Faute de temps, nous avons renoncé à visiter le musée.", note:"考查 faute de+无冠词名词:= par manque de。"}, {q:"Il a annulé le rendez-vous ___ il avait trop de travail. (借口)", a:"Il a annulé le rendez-vous sous prétexte qu'il avait trop de travail.", note:"考查 sous prétexte que:说话人暗示该理由不可信。"}, {q:"Il y avait ___ monde ___ nous avons renoncé à entrer. (tant de … que)", a:"Il y avait tant de monde que nous avons renoncé à entrer.", note:"考查名词前的数量结果:tant de+名词+que,不能用 si。"}, {q:"Mon réveil n'a pas sonné, ___ je suis arrivé en retard. (以致:si bien que)", a:"Mon réveil n'a pas sonné, si bien que je suis arrivé en retard.", note:"考查结果连词 si bien que:后接直陈式,客观陈述结果。"} ],
  "b2-but-condition": [ {q:"Il économise ___ (pouvoir) acheter une maison. (同主语→afin de+原形)", a:"Il économise afin de pouvoir acheter une maison.", note:"同主语目的:afin de + 原形"}, {q:"Le prof répète ___ tous ___ (comprendre). (异主语→afin que+虚拟)", a:"Le prof répète afin que tous comprennent.", note:"异主语目的:afin que + 虚拟式"}, {q:"___ il ___ (avoir) un imprévu, appelle-moi. (万一→au cas où+条件式)", a:"Au cas où il y aurait un imprévu, appelle-moi.", note:"au cas où 后接条件式。"}, {q:"Il a pris un taxi ___ (rater) son avion. (唯恐,同主语:de peur de+原形)", a:"Il a pris un taxi de peur de rater son avion.", note:"考查 de peur de+原形:同主语用 de peur de,异主语才用 de peur que+虚拟式。"}, {q:"Tu peux sortir ___ tu ___ (rentrer) avant minuit. (条件:à condition que+虚拟)", a:"Tu peux sortir à condition que tu rentres avant minuit.", note:"考查 à condition que+虚拟式:rentres 为虚拟式现在。"}, {q:"On mangera dehors, ___ il ne ___ (faire) trop froid. (除非,带赘词 ne)", a:"On mangera dehors, à moins qu'il ne fasse trop froid.", note:"考查 à moins que+ne+虚拟式:faire→fasse。"}, {q:"Parle plus fort ___ être entendu de tous. (以便:de manière à+原形)", a:"Parle plus fort de manière à être entendu de tous.", note:"考查 de manière à+原形:同主语目的的书面表达。"} ],
  "b2-accord-pp": [ {q:"Les lettres que j'ai ___ (écrire) sont sur la table. (COD 提前→配合)", a:"Les lettres que j'ai écrites sont sur la table.", note:"COD 阴性复数提前 → écrites。"}, {q:"Elle s'est ___ (laver) les mains. (后有直接宾语→不配合)", a:"Elle s'est lavé les mains.", note:"COD「les mains」在后 → 不配合。"}, {q:"Elles se sont ___ (parler) pendant des heures. (se 是间接宾语)", a:"Elles se sont parlé pendant des heures.", note:"se = COI(parler à)→ 不配合。"}, {q:"Marie et sa sœur sont ___ (venir) nous voir dimanche. (être→与主语配合)", a:"Marie et sa sœur sont venues nous voir dimanche.", note:"考查 être 型配合:主语阴性复数→venues。"}, {q:"Ta veste ? Je l'ai ___ (mettre) au vestiaire. (l'=提前的 COD,阴性)", a:"Ta veste ? Je l'ai mise au vestiaire.", note:"考查 avoir+提前代词 COD:l'=la veste→mise。"}, {q:"Ils se sont ___ (rencontrer) à Lyon. (se=COD→配合)", a:"Ils se sont rencontrés à Lyon.", note:"考查代词式动词:rencontrer qn,se 是直接宾语→配合阳性复数。"} ],
  "b2-registres": [ {q:"Au registre courant : « Je suis crevé. » → « Je suis ___. » (口语→通用)", a:"Je suis fatigué.", note:"crevé → fatigué。"}, {q:"Au registre soutenu : « Tu peux me filer un truc ? » → « Pourriez-vous me donner ___ ? » (口语→正式)", a:"Pourriez-vous me donner un élément ?", note:"un truc → un élément。"}, {q:"Au registre soutenu : « Ça m'étonne. » → « ___ m'étonne. »", a:"Cela m'étonne.", note:"考查写作语域:口语 ça 在书面中改为 cela。"}, {q:"Rendez la question plus formelle : « Vous partez quand ? » → « ___ ? » (倒装疑问)", a:"Quand partez-vous ?", note:"考查疑问句语域:正式语体用倒装疑问,不用语调疑问。"} ],
  "b2-modalisation": [ {q:"Nuancez : « La situation s'améliore. » → ___ la situation s'améliore. (il semblerait que)", a:"Il semblerait que la situation s'améliore.", note:"il semblerait que 用条件式弱化断言"}, {q:"Atténuez : « C'est faux. » → « Cela ___ discutable. » (避免绝对化)", a:"Cela paraît discutable.", note:"用 paraît 委婉替代绝对判断"}, {q:"Nuancez avec <b>sans doute</b> (句首+倒装) : « Il a raison. » → « Sans doute ___ raison. »", a:"Sans doute a-t-il raison.", note:"考查 sans doute 句首引起的主谓倒装:a-t-il。"}, {q:"« La réunion sera peut-être annulée. » → « Il n'est pas exclu que la réunion ___ (être) annulée. » (+虚拟)", a:"Il n'est pas exclu que la réunion soit annulée.", note:"考查 il n'est pas exclu que+虚拟式:soit。"}, {q:"Nuancez : « Tu as raison. » → « ___ , tu as raison. » (在一定程度上)", a:"Dans une certaine mesure, tu as raison.", note:"考查范围限定语 dans une certaine mesure:避免绝对化表态。"} ],
  "b2-adj-sens": [ {q:"Placez <b>ancien</b> (= 以前的) : C'est mon ___ professeur ___ de français. (前置)", a:"C'est mon ancien professeur de français.", note:"前置 ancien = 以前的。"}, {q:"Placez <b>dernière</b> (= 上周) : Je l'ai vu la ___ semaine ___. (后置)", a:"Je l'ai vu la semaine dernière.", note:"后置 dernière = 上(周)。"}, {q:"Placez <b>propre</b> (= 自己的) : Elle a créé sa ___ entreprise ___ .", a:"Elle a créé sa propre entreprise.", note:"考查 propre 前置=自己的;后置才是干净的。"}, {q:"Placez <b>chère</b> (= 昂贵的) : Ils ont loué une ___ voiture ___ .", a:"Ils ont loué une voiture chère.", note:"考查 cher 后置=昂贵的;前置是亲爱的。"}, {q:"Placez <b>grand</b> (= 伟大的) : De Gaulle était un ___ homme ___ .", a:"De Gaulle était un grand homme.", note:"考查 grand 前置指人=伟大的;后置=高个子。"}, {q:"Placez <b>seule</b> (= 唯一的) : C'est la ___ solution ___ .", a:"C'est la seule solution.", note:"考查 seul 前置=唯一的;后置=孤独的。"}, {q:"Placez <b>pauvre</b> (= 可怜的) : Ce ___ chat ___ a passé la nuit dehors.", a:"Ce pauvre chat a passé la nuit dehors.", note:"考查 pauvre 前置=可怜的;后置=贫穷的。"} ],
  "c1-passe-simple": [ {q:"Mettez au passé simple : Il est entré, a salué et s'est assis. → Il ___ .", a:"Il entra, salua et s'assit.", note:"文学叙事:复合过去→简单过去 entra, salua, s'assit"}, {q:"Mettez au passé simple : Victor Hugo est né en 1802 et est mort en 1885. → Victor Hugo ___ en 1802 et ___ en 1885.", a:"Victor Hugo naquit en 1802 et mourut en 1885.", note:"不规则简单过去:naître→naquit,mourir→mourut"}, {q:"Mettez les verbes au temps qui convient (背景 imparfait + 推进 passé simple) : Il ___ (pleuvoir) ; soudain, la porte ___ (s'ouvrir).", a:"Il pleuvait ; soudain, la porte s'ouvrit.", note:"考查 imparfait 与 passé simple 的配合:背景描写用未完成过去时,突发推进动作用简单过去时。"}, {q:"Mettez au passé simple (识别 -us 型变位) : Il a été surpris et il a eu peur. → Il ___ surpris et il ___ peur.", a:"Il fut surpris et il eut peur.", note:"考查 être/avoir 的简单过去时 -us 型:fut、eut,阅读高频。"} ],
  "c1-subj-imparfait": [ {q:"Réécrivez en français moderne : Il fallait qu'il <b>partît</b> sur-le-champ. → Il fallait qu'il ___ sur-le-champ.", a:"Il fallait qu'il parte sur-le-champ.", note:"文学虚拟未完成 partît→现代法语用虚拟现在 parte"}, {q:"Réécrivez en français moderne : Je craignais qu'elle ne <b>vînt</b> pas. → Je craignais qu'elle ne ___ pas.", a:"Je craignais qu'elle ne vienne pas.", note:"文学 vînt → 现代 vienne。"}, {q:"Choisissez la bonne forme (fût ou fut ?) : Bien qu'il ___ (être) tard, personne ne partit. <span class=hint>提示:bien que 要求虚拟式,文学语体</span>", a:"Bien qu'il fût tard, personne ne partit.", note:"考查 fût(虚拟式未完成,带长音符)与 fut(简单过去时)的辨析:bien que 后须用虚拟式。"}, {q:"Mettez à l'imparfait du subjonctif (文学呼应) : On attendait qu'il ___ (répondre).", a:"On attendait qu'il répondît.", note:"考查主句过去时的文学呼应:répondît 由简单过去 répondit 派生,加长音符。"} ],
  "c1-cond-2e": [ {q:"Réécrivez en français courant : Il <b>eût aimé</b> vous connaître. → Il ___ vous connaître.", a:"Il aurait aimé vous connaître.", note:"文学第二式 eût aimé = 通用 aurait aimé"}, {q:"Réécrivez en français courant : Il <b>eût fallu</b> agir plus tôt. → Il ___ agir plus tôt.", a:"Il aurait fallu agir plus tôt.", note:"文学 eût fallu = 现代 aurait fallu。"}, {q:"Réécrivez en français courant (être 类) : Sans lui, elle <b>fût tombée</b>. → Sans lui, elle ___ .", a:"Sans lui, elle serait tombée.", note:"考查 fût + 过去分词 = 条件式过去(être 类,分词配合主语):fût tombée → serait tombée。"}, {q:"Réécrivez en français courant (固定表达) : On <b>eût dit</b> un rêve. → On ___ un rêve.", a:"On aurait dit un rêve.", note:"考查高频固定表达 on eût dit = on aurait dit(简直像)。"} ],
  "c1-inversion": [ {q:"Faites l'inversion : Peut-être / il / viendra / demain. → ___ demain.", a:"Peut-être viendra-t-il demain.", note:"peut-être 句首→倒装,元音间加 -t-"}, {q:"Complétez (刚…就) : À peine ___ sorti qu'il se mit à pleuvoir. (il / être)", a:"À peine était-il sorti qu'il se mit à pleuvoir.", note:"à peine 句首→倒装 était-il"}, {q:"Inversion après <b>aussi</b> (=因此) : Il pleuvait ; aussi ___ restés. (nous / être)", a:"Il pleuvait ; aussi sommes-nous restés.", note:"aussi(=因此)句首→倒装 sommes-nous"}, {q:"Faites l'inversion : Sans doute / vous / avez / raison. → ___ raison.", a:"Sans doute avez-vous raison.", note:"考查 sans doute 句首的文体性倒装:sans doute + 动词-主语。"}, {q:"Complétez avec inversion (en vain 句首,passé simple) : En vain ___ une excuse. (il / chercher)", a:"En vain chercha-t-il une excuse.", note:"考查 en vain 等句首副词触发的倒装:chercha-t-il(元音间加 -t-)。"}, {q:"Complétez sans inversion (句中 aussi = 『也』) : Il parle anglais ; il parle ___ allemand.", a:"Il parle anglais ; il parle aussi allemand.", note:"考查句中 aussi(= 也)不倒装,与句首 aussi(= 因此)倒装相区别。"} ],
  "c1-dislocation": [ {q:"Disloquez le COD (口语) : J'ai adoré ce film. → Ce film, je ___ .", a:"Ce film, je l'ai adoré.", note:"COD 前移后句中用代词 l' 复指"}, {q:"Mise en relief avec <b>ce qui… c'est</b> : L'effort compte. → ___ compte, ___ l'effort.", a:"Ce qui compte, c'est l'effort.", note:"强调主语用 ce qui…, c'est…"}, {q:"Disloquez à droite (句尾复指) : Ton frère est génial. → Il est génial, ___ .", a:"Il est génial, ton frère.", note:"考查右移位:成分移到句尾,句中先用代词 il 指代,口语地道说法。"}, {q:"Mettez en relief avec <b>c'est… que</b> : Nous avancerons par le dialogue. → ___ par le dialogue ___ nous avancerons.", a:"C'est par le dialogue que nous avancerons.", note:"考查 c'est…que 对状语的强调,书面议论文的常用句架。"} ],
  "c1-concession-indefinie": [ {q:"Complétez (无论什么,+虚拟) : ___ tu fasses, je te soutiens.", a:"Quoi que tu fasses, je te soutiens.", note:"quoi que + 虚拟 = 无论做什么"}, {q:"Complétez (无论…如何,quel 配合) : ___ le résultat, restons calmes.", a:"Quel que soit le résultat, restons calmes.", note:"quel que 分写,与 résultat 配合。"}, {q:"Complétez (无论多难,+虚拟) : ___ difficile que ce soit, persévère. (si)", a:"Si difficile que ce soit, persévère.", note:"si + 形容词 + que + 虚拟 = 无论多…"}, {q:"Complétez (无论去哪里,+虚拟式) : ___ tu ___ (aller), je te suivrai.", a:"Où que tu ailles, je te suivrai.", note:"考查 où que + 虚拟式:泛指任何地点。"}, {q:"Complétez (无论您是谁,+虚拟式) : ___ vous ___ (être), montrez votre badge.", a:"Qui que vous soyez, montrez votre badge.", note:"考查 qui que + 虚拟式:泛指任何人。"}, {q:"Un mot ou deux ? Choisissez : ___ (quoique / quoi que) tu dises, il ne changera pas d'avis.", a:"Quoi que tu dises, il ne changera pas d'avis.", note:"考查 quoi que(两个词,『无论什么』,作 dire 的宾语)与 quoique(一个词,『尽管』)之辨。"}, {q:"Complétez (quel 与复数配合) : ___ ___ (être) vos raisons, la règle s'applique.", a:"Quelles que soient vos raisons, la règle s'applique.", note:"考查 quel que 的性数配合:vos raisons 阴性复数 → quelles que soient。"} ],
  "c1-hypothese-sans-si": [ {q:"Remplacez « si » par un gérondif : Si tu travaillais davantage, tu réussirais. → ___ davantage, tu réussirais.", a:"En travaillant davantage, tu réussirais.", note:"副动词 en + 现在分词代替 si 从句"}, {q:"Complétez avec <b>au cas où</b> (+条件式!) : ___ tu ___ faim, il y a du pain. (avoir)", a:"Au cas où tu aurais faim, il y a du pain.", note:"au cas où 接条件式。"}, {q:"Complétez avec <b>à condition que</b> (+虚拟式) : Tu peux sortir, ___ tu ___ (rentrer) avant minuit.", a:"Tu peux sortir, à condition que tu rentres avant minuit.", note:"考查 à condition que + 虚拟式表条件(同主语时改用 à condition de + 原形)。"}, {q:"Reliez avec <b>pour peu que</b> (+虚拟式) : S'il fait beau, la fête aura lieu dehors. → ___ , la fête aura lieu dehors.", a:"Pour peu qu'il fasse beau, la fête aura lieu dehors.", note:"考查 pour peu que + 虚拟式(只要稍微/但凡):fasse。"}, {q:"Remplacez la subordonnée par <b>sans</b> + nom : Si tu ne m'avais pas aidé, j'aurais échoué. → ___ , j'aurais échoué. (aide)", a:"Sans ton aide, j'aurais échoué.", note:"考查 sans + 名词表否定性假设,替代 si 从句。"} ],
  "c1-ne-expletif": [ {q:"Ajoutez le <b>ne</b> explétif : Je crains qu'il ___ soit trop tard.", a:"Je crains qu'il ne soit trop tard.", note:"此 ne 非否定。"}, {q:"Ajoutez le <b>ne</b> explétif : Il est plus malin qu'on ___ le pense.", a:"Il est plus malin qu'on ne le pense.", note:"比较 que 后加赘词 ne,不表否定"}, {q:"Ajoutez le <b>ne</b> explétif : Finis avant que la nuit ___ tombe.", a:"Finis avant que la nuit ne tombe.", note:"考查 avant que 后的赘词 ne(正式语体,不表否定)。"}, {q:"Ajoutez le <b>ne</b> explétif : Je sortirai, à moins qu'il ___ pleuve.", a:"Je sortirai, à moins qu'il ne pleuve.", note:"考查 à moins que 后的赘词 ne。"}, {q:"Complétez (怕被看见,赘词 ne,不加 pas) : Il se cache de peur qu'on ___ le ___ (voir).", a:"Il se cache de peur qu'on ne le voie.", note:"考查 de peur que + 虚拟式 + 赘词 ne:『怕被看见』并非否定,故不加 pas。"} ],
  "c1-accord-avance": [ {q:"Accordez (施动者→配合) : Les artistes que j'ai ___ chanter. (voir)", a:"Les artistes que j'ai vus chanter.", note:"他们在唱→配合。"}, {q:"Accordez ou non (被动作→不配合) : La chanson que j'ai ___ chanter. (entendre)", a:"La chanson que j'ai entendu chanter.", note:"歌是被唱→不配合。"}, {q:"Accordez ou non (COD = en) : Des fautes ? J'en ai ___ . (faire)", a:"Des fautes ? J'en ai fait.", note:"COD 是 en 时过去分词不配合:fait"}, {q:"Accordez ou non (fait + infinitif) : Elle s'est ___ (faire) couper les cheveux.", a:"Elle s'est fait couper les cheveux.", note:"考查 fait + 原形永不配合:使役结构中一律写 fait。"} ],
  "c1-connecteurs-soutenus": [ {q:"Reliez avec <b>d'autant plus… que</b> : Il est ___ déçu ___ il espérait gagner.", a:"Il est d'autant plus déçu qu'il espérait gagner.", note:"d'autant plus…que = 因…而更加"}, {q:"Complétez avec <b>or</b> : Tous le savaient. ___ , personne n'agit.", a:"Tous le savaient. Or, personne n'agit.", note:"or 引出与预期相反的新前提"}, {q:"Complétez avec <b>sans quoi</b> (否则) : Dépêchons-nous, ___ nous serons en retard.", a:"Dépêchons-nous, sans quoi nous serons en retard.", note:"考查 sans quoi(= 否则,faute de quoi 同义)引出后果。"}, {q:"Complétez avec <b>quitte à</b> (哪怕要 + 原形) : Il dira la vérité, ___ déplaire.", a:"Il dira la vérité, quitte à déplaire.", note:"考查 quitte à + 动词原形:接受可能的代价。"}, {q:"Complétez avec <b>dans la mesure où</b> (就…而言) : Le projet est viable ___ le budget est respecté.", a:"Le projet est viable dans la mesure où le budget est respecté.", note:"考查 dans la mesure où + 直陈式:限定论断成立的范围。"}, {q:"Complétez avec <b>dès lors que</b> (一旦/既然) : ___ vous signez, le contrat s'applique.", a:"Dès lors que vous signez, le contrat s'applique.", note:"考查 dès lors que + 直陈式:既然/一旦成立的前提。"} ],
  "c1-apres-que": [ {q:"Complétez (直陈式!) : Après qu'il ___ (partir, passé composé), j'ai rangé.", a:"Après qu'il est parti, j'ai rangé.", note:"après que 接直陈式。"}, {q:"Complétez (avant que → 虚拟) : Range avant qu'il ___ (arriver).", a:"Range avant qu'il arrive.", note:"avant que + 虚拟式(après que 才接直陈)"}, {q:"Complétez (直陈式先将来) : Après que tu ___ (terminer, futur antérieur), appelle-moi.", a:"Après que tu auras terminé, appelle-moi.", note:"考查 après que 在将来语境接直陈式先将来时,不可写成虚拟式。"} ],
  "c1-impersonnelles": [ {q:"Complétez avec <b>il convient de</b> : ___ rester prudent.", a:"Il convient de rester prudent.", note:"il convient de + 原形 = 宜、应当"}, {q:"Complétez avec <b>force est de constater que</b> : ___ rien n'a changé.", a:"Force est de constater que rien n'a changé.", note:"固定句式 force est de constater que = 不得不承认"}, {q:"Complétez avec <b>il importe que</b> (+虚拟式) : ___ chacun ___ (prendre) ses responsabilités.", a:"Il importe que chacun prenne ses responsabilités.", note:"考查 il importe que + 虚拟式:prenne。"}, {q:"Complétez avec <b>il s'avère que</b> : ___ les chiffres étaient faux.", a:"Il s'avère que les chiffres étaient faux.", note:"考查 il s'avère que + 直陈式:事实证明。"}, {q:"Complétez avec <b>il va de soi que</b> : ___ les frais seront remboursés.", a:"Il va de soi que les frais seront remboursés.", note:"考查 il va de soi que(不言而喻)+ 直陈式。"}, {q:"Complétez avec <b>il n'empêche que</b> : Le projet coûte cher ; ___ il demeure indispensable.", a:"Le projet coûte cher ; il n'empêche qu'il demeure indispensable.", note:"考查 il n'empêche que(尽管如此)+ 直陈式,注意 que + il 省音为 qu'il。"} ],
  "c1-adj-verbal": [ {q:"Adjectif verbal (配合) : une journée ___ (fatiguer)", a:"une journée fatigante", note:"形容词→配合,拼 -gant。"}, {q:"Participe présent (不变,-gu-) : ___ tout le monde, il partit. (fatiguer)", a:"Fatiguant tout le monde, il partit.", note:"分词带宾语→不变,拼 -guant。"}, {q:"Adjectif ou participe ? : des propos ___ (provoquer, 挑衅性的言论) / En ___ (provoquer) ses adversaires, il perdit le débat.", a:"des propos provocants / En provoquant ses adversaires, il perdit le débat.", note:"考查 -cant/-quant 之辨:形容词 provocant(配合,-c-),分词 provoquant(不变,-qu-)。"}, {q:"Adjectif ou participe ? : l'année ___ (précéder, 前一年) / l'année ___ (précéder) la guerre (带宾语)", a:"l'année précédente / l'année précédant la guerre", note:"考查 -ent/-ant 之辨:précédent(e) 形容词配合;précédant 分词不变且带宾语。"} ],
  "c2-passe-anterieur": [ {q:"改写成文学语体(先过去时 + 简单过去时) : « Quand il a eu fini son discours, il est sorti. »", a:"Quand il eut fini son discours, il sortit.", note:"考查时间连词从句:quand + 先过去时,主句简单过去时,替代口语的『复合过去时组合』。"}, {q:"改为先过去时 + 简单过去时 : « Dès qu'elle était partie, le silence est retombé. »", a:"Dès qu'elle fut partie, le silence retomba.", note:"考查时间连词从句:dès que + 先过去时(être 类动词分词配合阴性)。"}, {q:"« À peine ___ fini son repas que le téléphone sonna. » (il / avoir,先过去时 + 倒装)", a:"À peine eut-il fini son repas que le téléphone sonna.", note:"考查 à peine…que 倒装:句首 à peine 触发主谓倒装,从句用先过去时。"} ],
  "c2-concordance-litteraire": [ {q:"改写成文学呼应(虚拟式未完成过去) : « Je voulais qu'il vienne. »", a:"Je voulais qu'il vînt.", note:"考查虚拟式未完成过去:主句过去时 + 从句同时 → vînt。"}, {q:"改写成文学呼应(表「在前」用虚拟式愈过去) : « Bien qu'il ait plu, ils sortirent. »", a:"Bien qu'il eût plu, ils sortirent.", note:"考查虚拟式愈过去:从句动作在前 → eût plu。"}, {q:"改写成现代法语 : « Il doutait que nous eussions compris. » → « Il doutait que nous ___ . »", a:"Il doutait que nous ayons compris.", note:"考查识别文学呼应:虚拟式愈过去 eussions compris = 现代虚拟式过去 ayons compris。"} ],
  "c2-concession-soutenue": [ {q:"« Quand bien même il ___ (pleuvoir), je sortirais. » (即便)", a:"Quand bien même il pleuvrait, je sortirais.", note:"quand bien même + 条件式。"}, {q:"« Tout intelligent qu'il ___ (être), il se trompe. » (强调事实→直陈)", a:"Tout intelligent qu'il est, il se trompe.", note:"tout… que + 直陈式。"}, {q:"« ___ (n'être) son aide, j'aurais échoué. » (若非)", a:"N'était son aide, j'aurais échoué.", note:"n'était + 名词 = 若非。"}, {q:"« Le plan est bon, encore qu'il ___ (être) perfectible. » (虽然,补充让步)", a:"Le plan est bon, encore qu'il soit perfectible.", note:"考查 encore que + 虚拟式,表事后补充的让步。"}, {q:"« ___ je m'en souvienne, il n'a jamais menti. » (就我记忆所及)", a:"Pour autant que je m'en souvienne, il n'a jamais menti.", note:"考查 pour autant que + 虚拟式,表限定范围的让步。"} ],
  "c2-subj-fin": [ {q:"« Non qu'il ___ (être) bête, mais il est distrait. » (并非)", a:"Non qu'il soit bête, mais il est distrait.", note:"non que + 虚拟式。"}, {q:"« Parle fort de sorte qu'on t'___ (entendre). » (目的)", a:"Parle fort de sorte qu'on t'entende.", note:"de sorte que 表目的→虚拟。"}, {q:"« C'est le seul qui ___ (savoir) la vérité. » (主观→虚拟)", a:"C'est le seul qui sache la vérité.", note:"最高级/le seul + qui → 虚拟式,表主观判断。"}, {q:"« Il parlait très bas, de sorte que personne ne l'___ (entendre, 结果). »", a:"Il parlait très bas, de sorte que personne ne l'entendait.", note:"考查 de sorte que 表结果 → 直陈式,与表目的 + 虚拟式相对。"}, {q:"« Le fait qu'il ___ (être) étranger ne change rien à l'affaire. » (le fait que 句首)", a:"Le fait qu'il soit étranger ne change rien à l'affaire.", note:"考查 le fait que 作主语时常接虚拟式。"}, {q:"« Soit qu'il ___ (avoir) peur, soit qu'il ___ (être) distrait, il n'a pas répondu. » (或是…或是…)", a:"Soit qu'il ait eu peur, soit qu'il ait été distrait, il n'a pas répondu.", note:"考查 soit que… soit que + 虚拟式(此处为虚拟式过去)。"} ],
  "c2-accord-extreme": [ {q:"« Les rois qui se sont ___ (succéder). » (se = à qn)", a:"Les rois qui se sont succédé.", note:"se = 间接宾语 → 不配合。"}, {q:"« Veuillez trouver ___ (ci-joint) la facture. » (置于名词前)", a:"Veuillez trouver ci-joint la facture.", note:"ci-joint 前置 → 不配合。"}, {q:"« Les sommes que ce projet a ___ (coûter). » (本义/数量)", a:"Les sommes que ce projet a coûté.", note:"coûté 本义 → 不配合。"}, {q:"« Les efforts que ce projet nous a ___ (coûter). » (引申义)", a:"Les efforts que ce projet nous a coûtés.", note:"考查 coûter 引申义(使付出)→ COD 提前须配合。"}, {q:"« Elles se sont ___ (parler) puis se sont ___ (plaire). » (se = à qn)", a:"Elles se sont parlé puis se sont plu.", note:"考查 se parler / se plaire:se 为间接宾语 → 分词不配合。"}, {q:"« Vous trouverez la facture ___ (ci-joint, 置于名词后). »", a:"Vous trouverez la facture ci-jointe.", note:"考查 ci-joint 后置 → 配合(前置则不变)。"} ],
  "c2-inversion-style": [ {q:"主语后置 : « La mer s'étendait au loin. » → « Au loin ___ . »", a:"Au loin s'étendait la mer.", note:"考查状语句首引起的主语后置。"}, {q:"主语后置 : « Sur la colline, un château se dressait. »", a:"Sur la colline se dressait un château.", note:"考查地点状语句首 + 名词主语后置。"}, {q:"加入引述语(主语后置) : « Je reviendrai bientôt », ___ . (répondre, elle, 简单过去时)", a:"« Je reviendrai bientôt », répondit-elle.", note:"考查引述语 incise 中的主谓倒装。"}, {q:"主语后置(关系从句) : « le jardin où ma grand-mère vivait » → « le jardin où ___ »", a:"le jardin où vivait ma grand-mère", note:"考查关系从句中名词主语后置的文体倒装。"} ],
  "c2-ellipse": [ {q:"用省略式改写 : « Il est inutile d'insister. » → « ___ insister. »", a:"Inutile d'insister.", note:"考查省略非人称主语 Il est 的凝练句式。"}, {q:"省略可复原的动词 : « Les uns riaient ; les autres pleuraient, en larmes. » → « Les uns riaient ; les autres, ___ . »", a:"Les uns riaient ; les autres, en larmes.", note:"考查并列句中省略可复原的动词。"}, {q:"改写成格言式省略 : « Chacun a ses goûts. » → « ___ ses goûts. »", a:"À chacun ses goûts.", note:"考查格言式省略:省去动词,以 à chacun 开头。"}, {q:"改写成新闻标题(名词化省略) : « Le ministre a démissionné. » → « ___ du ministre. »", a:"Démission du ministre.", note:"考查名词化省略:标题以名词短语代替完整句。"} ],
  "c2-conjecture": [ {q:"« On sonne — ce ___ (être,推测性将来时) le facteur. » (多半是)", a:"On sonne — ce sera le facteur.", note:"futur de conjecture = 大概。"}, {q:"« Selon la presse, le bilan ___ (s'élever,新闻条件式) à dix morts. » (据称)", a:"Selon la presse, le bilan s'élèverait à dix morts.", note:"条件式 = 未经证实。"}, {q:"« Il n'est pas là ; il ___ (devoir) être déjà parti. » (想必)", a:"Il n'est pas là ; il doit être déjà parti.", note:"考查 devoir 表情态推测『想必』。"}, {q:"« Il n'est pas venu — il ___ (oublier,先将来时表对已发生之事的推测). »", a:"Il n'est pas venu — il aura oublié.", note:"考查 futur antérieur de conjecture:推测某事多半已经发生。"} ],
  "c2-rection": [ {q:"« Tu me ___ (manquer). » (我想你)", a:"Tu me manques.", note:"manquer à:主宾与中文相反。"}, {q:"« Elle ___ (jouer) du piano et ___ (jouer) au tennis. »", a:"Elle joue du piano et joue au tennis.", note:"jouer de 乐器 / jouer à 运动。"}, {q:"« Il ___ (tenir) de son père. » (像)", a:"Il tient de son père.", note:"tenir de = 像;tenir à = 在乎。"}, {q:"« Ce rapport ___ (manquer) ___ précision. » (缺乏)", a:"Ce rapport manque de précision.", note:"考查 manquer de = 缺乏,与 manquer à(使想念)相对。"}, {q:"« De quoi ___ -il dans ce chapitre ? » (s'agir,涉及什么)", a:"De quoi s'agit-il dans ce chapitre ?", note:"考查 il s'agit de 非人称结构,主语固定为 il。"}, {q:"« Elle m'___ encore de mon retard. » (en vouloir,怪罪)", a:"Elle m'en veut encore de mon retard.", note:"考查 en vouloir à qn de qch = 因某事怪罪某人。"} ],
  "c2-cause-niee": [ {q:"« Il a refusé, non qu'il ___ (être) timide, mais par principe. » (并非因为)", a:"Il a refusé, non qu'il soit timide, mais par principe.", note:"non que + 虚拟式。"}, {q:"补全 : « ___ je n'aime pas, ___ je n'ai pas le temps. » (不是…而是…)", a:"Ce n'est pas que je n'aime pas, c'est que je n'ai pas le temps.", note:"考查 ce n'est pas que… c'est que 的否定—修正原因框架。"}, {q:"« Elle se tait, non pas qu'elle ___ (avoir) peur, mais parce qu'elle réfléchit. » (并非因为)", a:"Elle se tait, non pas qu'elle ait peur, mais parce qu'elle réfléchit.", note:"考查 non (pas) que + 虚拟式,mais parce que + 直陈式给出真实原因。"} ],
  "c2-cohesion": [ {q:"« ___ , la décision est prise. » (无论如何)", a:"Quoi qu'il en soit, la décision est prise.", note:"考查 quoi qu'il en soit 收束段落。"}, {q:"« ___ , il avait raison. » (就此事而言)", a:"En l'occurrence, il avait raison.", note:"考查 en l'occurrence 落到具体情形。"}, {q:"« Le projet coûte cher ; ___ , il est nécessaire. » (话虽如此)", a:"Le projet coûte cher ; cela étant, il est nécessaire.", note:"考查 cela étant 承认事实后转折。"}, {q:"« Il se dit pauvre ; ___ , il vient d'acheter une villa. » (然而,引入新论据)", a:"Il se dit pauvre ; or, il vient d'acheter une villa.", note:"考查 or 引入与前述相抵的新论据。"}, {q:"« La route est longue ; elle est, ___ , fort belle. » (再者/不过)", a:"La route est longue ; elle est, au demeurant, fort belle.", note:"考查 au demeurant 补充略带转折的评价。"}, {q:"« Les coûts augmentent ; ___ , les marges diminuent. » (因而,文语)", a:"Les coûts augmentent ; partant, les marges diminuent.", note:"考查文语连接词 partant = 因而。"}, {q:"« ___ , votre proposition mérite examen. » (在这方面)", a:"À cet égard, votre proposition mérite examen.", note:"考查 à cet égard 限定论述的方面。"} ],
  "c2-exclamation": [ {q:"« ___ temps perdu ! » (多么多…!表数量)", a:"Que de temps perdu !", note:"考查 Que de + 名词的数量感叹。"}, {q:"« Il est plus âgé que je ___ le croyais. » (比较从句的赘词 ne)", a:"Il est plus âgé que je ne le croyais.", note:"考查不等比较后的文学性赘词 ne。"}, {q:"« ___ l'avez-vous avoué plus tôt ! » (真该早点承认,文学惋惜 + 倒装)", a:"Que ne l'avez-vous avoué plus tôt !", note:"考查 Que ne + 倒装的文学惋惜句式。"}, {q:"« ___ je regrette ces années ! » (多么,文学感叹)", a:"Combien je regrette ces années !", note:"考查 Combien…! 的文学感叹用法。"} ],
};

const GRAMMAR = [...A1, ...A2, ...B1, ...B2, ...C1, ...C2];

/* ===================== 渲染 ===================== */
const $ = s => document.querySelector(s);
const content = $("#content"), sidebar = $("#sidebar");
let activeLevel = "ALL", query = "";

function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stripTags(s){return String(s).replace(/<[^>]+>/g,'');}
function tts(fr){const t=stripTags(fr);return t?`<button class="tts" data-tts="${escAttr(t)}" title="朗读法语 / Écouter">🔊</button>`:"";}
// titleFr is "français · 中文" for some entries but Chinese-only for others; g.title always holds the French
function fullTitle(g){return /[一-鿿]/.test(g.titleFr.split(" · ")[0]) ? `${g.title} · ${g.titleFr}` : g.titleFr;}
function cardHTML(g){
  const forms = g.forms ? `<div class="forms">${g.forms}</div>` : "";
  const tip = g.tip ? `<div class="tip">${g.tip}</div>` : "";
  const ex = (g.ex||[]).map(e=>`<li><div class="fr">${tts(e.fr)} ${e.fr}</div><div class="zh">${e.zh}</div>${e.use?`<div class="use">📌 ${e.use}</div>`:""}</li>`).join("");
  const pr = (typeof PRACTICE!=="undefined" && PRACTICE[g.id]) || null;
  let practice="";
  if(pr && pr.length){
    const items = pr.map(p=>`<li><div class="q">${p.q} <button class="reveal">显示答案 / Réponse</button></div><div class="a hidden">✓ ${p.a} ${tts(p.a)}${p.note?` <span class="anote">${p.note}</span>`:""}</div></li>`).join("");
    practice = `<div class="practice"><div class="label">练习 · Exercices</div><ol class="qs">${items}</ol></div>`;
  }
  return `<article class="card" id="${g.id}" data-level="${g.level}">
    <h3><span class="ttl">${fullTitle(g)}</span> ${tts(g.title)} <span class="badge ${g.level}">${g.level}</span> <button class="say-all" title="仅朗读本节(标题+讲解+例句) / Lire cette fiche">▶ 整段朗读</button> <button class="say-from" title="从本节起连续朗读全部,可在顶栏暂停/停止 / Lire en continu à partir d'ici">⏩ 从此连读</button></h3>
    <div class="expl">
      <div class="zh">${g.zh}</div>
      <div class="fr">${tts(g.fr)} ${g.fr}</div>
    </div>
    ${forms}
    <div class="label">例句 · Exemples</div>
    <ul class="ex">${ex}</ul>
    ${tip}
    ${practice}
  </article>`;
}

function matches(g){
  if(activeLevel!=="ALL" && g.level!==activeLevel) return false;
  if(!query) return true;
  const hay = (g.title+g.titleFr+g.zh+g.fr+g.cat+(g.ex||[]).map(e=>e.fr+e.zh).join("")).toLowerCase();
  return hay.includes(query);
}

function render(){
  if(typeof stopSpeak==='function')stopSpeak();
  const list = GRAMMAR.filter(matches);
  // group by level then cat, preserving order
  let html="", lastCat="";
  const order = {A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
  list.sort((a,b)=> (order[a.level]-order[b.level]) || 0);
  list.forEach(g=>{
    const key = g.level+" · "+g.cat;
    if(key!==lastCat){ html += `<div class="cathead">${g.level} · ${g.cat} <span style="font-weight:400">/ ${g.catFr}</span></div>`; lastCat=key; }
    html += cardHTML(g);
  });
  content.innerHTML = html;
  $("#nores").classList.toggle("hidden", list.length>0);
  $("#count").textContent = `共 ${GRAMMAR.length} 个语法点 · 当前显示 ${list.length} 个`;
  buildSidebar(list);
}

function buildSidebar(list){
  let html = `<div class="brand">法语语法手册<small>Grammaire française · A1–C2</small></div>`;
  let lastLevel="", lastCat="";
  list.forEach(g=>{
    if(g.level!==lastLevel){ html+=`<div class="navlevel">${g.level}</div>`; lastLevel=g.level; lastCat=""; }
    if(g.cat!==lastCat){ html+=`<div class="navcat">${g.cat}</div>`; lastCat=g.cat; }
    html += `<span class="navitem" data-id="${g.id}">${fullTitle(g).split(" · ")[0]}</span>`;
  });
  sidebar.innerHTML = html;
  sidebar.querySelectorAll(".navitem").forEach(n=>{
    n.onclick=()=>{
      const el=document.getElementById(n.dataset.id);
      if(el){el.scrollIntoView({behavior:"smooth",block:"start"});
        sidebar.querySelectorAll(".navitem").forEach(x=>x.classList.remove("active"));
        n.classList.add("active");
        closeMenu();}
    };
  });
}

/* ===================== 交互 ===================== */
$("#search").addEventListener("input", e=>{ query=e.target.value.trim().toLowerCase(); render(); });
$("#chips").addEventListener("click", e=>{
  if(!e.target.classList.contains("chip")) return;
  activeLevel=e.target.dataset.l;
  $("#chips").querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.l===activeLevel));
  render();
});
const themeBtn=$("#themeBtn");
function setTheme(t){ document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("gr-theme",t);}catch(e){} }
themeBtn.onclick=()=>{ const cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; setTheme(cur); };
try{ const saved=localStorage.getItem("gr-theme"); if(saved) setTheme(saved); }catch(e){}

/* mobile menu */
const scrim=$("#scrim");
function closeMenu(){ sidebar.classList.remove("open"); scrim.classList.remove("open"); }
$("#menuToggle").onclick=()=>{ sidebar.classList.toggle("open"); scrim.classList.toggle("open"); };
scrim.onclick=closeMenu;

/* ===== TTS(法语朗读:高清神经语音 + 系统语音回退 + 语速调节) =====
   优先播放预生成的高清 mp3(edge-tts,iOS/离线/GitHub Pages 均可用);
   无对应音频或选了系统语音时,回退到浏览器 Web Speech。 */
let frVoice=null, voices=[], rate=0.95, curBtn=null, speakGen=0, speaking=false, paused=false, pendingNext=null;
let useNeural=false, neuralVoice='fr-FR', curAudio=null;
const MAN=(typeof window!=='undefined' && window.AUDIO_MANIFEST) || null;
const audioEl=(typeof Audio!=='undefined') ? new Audio() : null;
if(audioEl){ audioEl.preload='auto'; try{audioEl.preservesPitch=true;audioEl.mozPreservesPitch=true;audioEl.webkitPreservesPitch=true;}catch(e){} }
const voiceSel=document.getElementById('voiceSel'), rateInput=document.getElementById('rate'),
      rateVal=document.getElementById('rateVal'), voiceTest=document.getElementById('voiceTest'),
      ttsPause=document.getElementById('ttsPause'), ttsStop=document.getElementById('ttsStop');
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function setVoiceFromValue(val){
  if(val && val.indexOf('neural:')===0){ useNeural=true; neuralVoice=val.slice(7); frVoice=null; }
  else if(val && val.indexOf('sys:')===0){ useNeural=false; const name=val.slice(4); frVoice=voices.find(v=>v.name===name)||null; }
  else { useNeural=false; frVoice=null; }
}
function applyVoiceChoice(saved){
  const opts=[...voiceSel.options].map(o=>o.value);
  let pick=(saved && opts.indexOf(saved)>=0) ? saved : null;
  if(!pick && MAN && MAN.voices && MAN.voices.length) pick='neural:'+(MAN.voices.indexOf('fr-FR')>=0?'fr-FR':MAN.voices[0]);
  if(!pick){ const s=voices.find(v=>/fr[-_]?FR/i.test(v.lang))||voices.find(v=>/^fr/i.test(v.lang)); if(s)pick='sys:'+s.name; }
  if(!pick && opts.length) pick=opts[0];
  if(pick==null)return;
  voiceSel.value=pick; setVoiceFromValue(pick);
}
function loadVoices(){
  voices=(window.speechSynthesis?speechSynthesis.getVoices():[])||[];
  if(!voiceSel)return;
  const prev=voiceSel.value, saved=lsGet('gr-voice');
  const fr=voices.filter(v=>/^fr/i.test(v.lang));
  voiceSel.innerHTML='';
  if(MAN && MAN.voices){ MAN.voices.forEach(code=>{ const o=document.createElement('option'); o.value='neural:'+code; const lb=(MAN.labels&&MAN.labels[code])||''; o.textContent='🔊 '+code+(lb?' · '+lb:'')+' · 高清'; voiceSel.appendChild(o); }); }
  fr.forEach(v=>{ const o=document.createElement('option'); o.value='sys:'+v.name; o.textContent=v.name.replace(/^(Microsoft|Google)\s+/,'')+' · '+v.lang; voiceSel.appendChild(o); });
  if(!voiceSel.options.length){ const o=document.createElement('option'); o.value=''; o.textContent='系统默认 fr-FR / Défaut'; voiceSel.appendChild(o); }
  applyVoiceChoice(prev || saved);
}
loadVoices();
if('speechSynthesis' in window){ try{window.speechSynthesis.onvoiceschanged=loadVoices;}catch(e){} }
if(voiceSel)voiceSel.addEventListener('change',e=>{ setVoiceFromValue(e.target.value); lsSet('gr-voice',e.target.value); });
if(rateInput){
  const sr=parseFloat(lsGet('gr-rate'));
  if(!isNaN(sr)){rate=sr;rateInput.value=sr;}
  if(rateVal)rateVal.textContent=rate.toFixed(2)+'×';
  rateInput.addEventListener('input',e=>{ rate=parseFloat(e.target.value); if(rateVal)rateVal.textContent=rate.toFixed(2)+'×'; lsSet('gr-rate',e.target.value); if(curAudio){try{curAudio.playbackRate=rate;}catch(err){}} });
}
if(voiceTest)voiceTest.addEventListener('click',()=>speak('Bonjour ! Ceci est un exemple de prononciation française.'));
function updateTransport(){
  if(ttsStop)ttsStop.disabled=!speaking;
  if(ttsPause){ttsPause.disabled=!speaking;ttsPause.textContent=paused?'▶':'⏸';ttsPause.title=paused?'继续 / Reprendre':'暂停 / Pause';}
}
function togglePause(){
  if(!speaking)return;
  if(paused){
    paused=false;
    if(curAudio){curAudio.play().catch(function(){});}
    else if('speechSynthesis' in window){try{speechSynthesis.resume();}catch(e){}}
    if(pendingNext){const f=pendingNext;pendingNext=null;f();}
  }else{
    paused=true;
    if(curAudio){try{curAudio.pause();}catch(e){}}
    else if('speechSynthesis' in window){try{speechSynthesis.pause();}catch(e){}}
  }
  updateTransport();
}
if(ttsPause)ttsPause.addEventListener('click',togglePause);
if(ttsStop)ttsStop.addEventListener('click',stopSpeak);
function clearReading(){document.querySelectorAll('.card.reading').forEach(x=>x.classList.remove('reading'));}
function stopSpeak(){
  speakGen++; speaking=false; paused=false; pendingNext=null;
  try{if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}
  if(audioEl){try{audioEl.pause();}catch(e){} audioEl.onended=null; audioEl.onerror=null;}
  curAudio=null;
  document.querySelectorAll('.tts.playing,.say-all.playing,.say-from.playing').forEach(x=>x.classList.remove('playing'));
  clearReading(); curBtn=null; updateTransport();
}
function utter(text){
  const u=new SpeechSynthesisUtterance(text);
  u.lang=(frVoice&&frVoice.lang)||'fr-FR'; if(frVoice)u.voice=frVoice; u.rate=rate;
  return u;
}
function audioURLFor(text){
  if(!useNeural||!MAN||!MAN.map)return null;
  const f=MAN.map[text];
  return f ? (MAN.base+neuralVoice+'/'+f) : null;
}
function speakOne(text,done){
  if(!('speechSynthesis' in window)){done&&done();return;}
  const u=utter(text); u.onend=()=>done&&done(); u.onerror=()=>done&&done();
  try{speechSynthesis.speak(u);}catch(e){done&&done();}
}
function playItems(items,btn){
  items=(items||[]).filter(x=>x&&x.t);
  if(!items.length)return;
  if(!('speechSynthesis' in window) && !(useNeural&&MAN&&audioEl))return;
  stopSpeak(); const gen=speakGen;
  speaking=true; paused=false; curBtn=btn||null; if(btn)btn.classList.add('playing');
  let i=0,lastCard=null;
  function next(){
    if(gen!==speakGen)return;
    if(paused){pendingNext=next;return;}
    if(i>=items.length){speaking=false;if(btn)btn.classList.remove('playing');clearReading();curAudio=null;updateTransport();return;}
    const it=items[i++];
    if(it.card&&it.card!==lastCard){clearReading();it.card.classList.add('reading');try{it.card.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){}lastCard=it.card;}
    const url=audioURLFor(it.t);
    if(url&&audioEl){
      curAudio=audioEl;
      audioEl.onended=()=>{if(gen===speakGen){curAudio=null;next();}};
      audioEl.onerror=()=>{if(gen!==speakGen)return;curAudio=null;speakOne(it.t,()=>{if(gen===speakGen)next();});};
      try{audioEl.pause();}catch(e){}
      audioEl.src=url;
      try{audioEl.playbackRate=rate||1;}catch(e){}
      const pr=audioEl.play();
      if(pr&&pr.catch)pr.catch(()=>{if(gen!==speakGen)return;curAudio=null;speakOne(it.t,()=>{if(gen===speakGen)next();});});
    }else{
      curAudio=null;
      speakOne(it.t,()=>{if(gen===speakGen)next();});
    }
  }
  next(); updateTransport();
}
function speak(text,btn){ playItems([{t:text}],btn); }
/* 事件委托:朗读 + 揭示答案 */
content.addEventListener('click',e=>{
  const sf=e.target.closest('.say-from');
  if(sf){
    stopSpeak();
    const card=sf.closest('.card');
    const cards=[...content.querySelectorAll('.card')];
    const start=cards.indexOf(card); const items=[];
    for(let k=start;k<cards.length;k++){
      [...cards[k].querySelectorAll('.tts')].filter(x=>!x.closest('.practice')).forEach(x=>items.push({t:x.getAttribute('data-tts'),card:cards[k]}));
    }
    playItems(items,null); return;
  }
  const sa=e.target.closest('.say-all');
  if(sa){
    const was=sa.classList.contains('playing'); stopSpeak(); if(was)return;
    const card=sa.closest('.card');
    const items=[...card.querySelectorAll('.tts')].filter(x=>!x.closest('.practice')).map(x=>({t:x.getAttribute('data-tts'),card}));
    playItems(items,sa); return;
  }
  const b=e.target.closest('.tts');
  if(b){speak(b.getAttribute('data-tts'),b);return;}
  const r=e.target.closest('.reveal');
  if(r){
    const li=r.closest('li'); const a=li&&li.querySelector('.a'); if(!a)return;
    const show=a.classList.contains('hidden');
    a.classList.toggle('hidden',!show);
    r.textContent=show?'隐藏答案 / Masquer':'显示答案 / Réponse';
    return;
  }
});

render();
</script>
