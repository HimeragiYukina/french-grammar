<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法语语法手册 A1–C2 · Grammaire française</title>
<style>
  :root{
    --bg:#f7f7f9; --panel:#ffffff; --ink:#1d1f24; --muted:#6b7280; --line:#e6e7eb;
    --fr:#0f3d6b; --frbg:#eef4fb; --zh:#3a3f47;
    --accent:#2563eb; --tip:#b4530a; --tipbg:#fdf3e7;
    --a1:#16a34a; --a2:#0891b2; --b1:#d97706; --b2:#9333ea; --c1:#4f46e5; --c2:#be123c;
    --radius:14px; --maxw:880px;
  }
  html[data-theme="dark"]{
    --bg:#15171c; --panel:#1d2027; --ink:#e8eaed; --muted:#9aa0aa; --line:#2c3038;
    --fr:#9cc7f5; --frbg:#18293c; --zh:#c9cdd4;
    --accent:#5b9bf7; --tip:#e8a85c; --tipbg:#2c2415;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  /* layout */
  .wrap{display:flex;min-height:100vh}
  #sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
    height:100vh;position:sticky;top:0;overflow-y:auto;padding:18px 14px}
  #main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
  .inner{width:100%;max-width:var(--maxw);padding:0 22px 80px}
  /* sidebar */
  .brand{font-weight:700;font-size:18px;padding:6px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
  .navlevel{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);
    margin:14px 8px 4px;text-transform:uppercase}
  .navcat{font-size:12.5px;font-weight:600;color:var(--muted);margin:9px 8px 2px}
  .navitem{display:block;padding:4px 10px;border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer}
  .navitem:hover{background:var(--frbg)}
  .navitem.active{background:var(--accent);color:#fff}
  /* topbar */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);padding:14px 0 10px;width:100%;display:flex;justify-content:center}
  .topbar .tb{width:100%;max-width:var(--maxw);padding:0 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #search{flex:1;min-width:160px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);font-size:14px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 11px;border:1px solid var(--line);border-radius:20px;background:var(--panel);
    color:var(--muted);font-size:13px;cursor:pointer;font-weight:600}
  .chip.on{color:#fff;border-color:transparent}
  .chip[data-l="ALL"].on{background:var(--accent)}
  .chip[data-l="A1"].on{background:var(--a1)} .chip[data-l="A2"].on{background:var(--a2)}
  .chip[data-l="B1"].on{background:var(--b1)} .chip[data-l="B2"].on{background:var(--b2)}
  .chip[data-l="C1"].on{background:var(--c1)} .chip[data-l="C2"].on{background:var(--c2)}
  .iconbtn{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--ink);cursor:pointer;font-size:14px}
  .ctl{padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:12.5px;max-width:160px}
  .spd{display:flex;align-items:center;gap:4px;padding:4px 9px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12.5px;color:var(--muted)}
  .spd input[type=range]{width:76px;accent-color:var(--accent);vertical-align:middle}
  .spd b{color:var(--ink);font-weight:600;min-width:42px;text-align:right}
  /* hero */
  .hero{padding:24px 0 6px}
  .hero h1{font-size:27px;margin:0 0 6px}
  .hero p{color:var(--muted);margin:4px 0;font-size:14.5px}
  .count{color:var(--muted);font-size:13px;margin:10px 0 0}
  /* card */
  .cathead{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;
    margin:30px 0 4px;padding-top:8px;border-top:1px dashed var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin:14px 0;scroll-margin-top:80px}
  .card h3{margin:0;font-size:19px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card h3 .zh{font-size:15px;color:var(--muted);font-weight:600}
  .badge{font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px}
  .badge.A1{background:var(--a1)} .badge.A2{background:var(--a2)}
  .badge.B1{background:var(--b1)} .badge.B2{background:var(--b2)}
  .badge.C1{background:var(--c1)} .badge.C2{background:var(--c2)}
  .expl{margin:12px 0}
  .expl .zh{color:var(--zh)}
  .expl .fr{color:var(--fr);background:var(--frbg);border-left:3px solid var(--fr);
    padding:8px 12px;border-radius:0 8px 8px 0;margin-top:8px;font-size:14.5px}
  .forms{margin:12px 0;overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  th{background:var(--frbg);color:var(--fr);font-weight:600}
  .ex{margin:6px 0 0;padding:0;list-style:none}
  .ex li{padding:8px 0;border-top:1px solid var(--line)}
  .ex li:first-child{border-top:none}
  .ex .fr{color:var(--fr);font-weight:600;font-size:15px}
  .ex .fr b{color:var(--accent)}
  .ex .zh{color:var(--muted);font-size:13.5px;margin-top:2px}
  .ex .use{color:var(--accent);font-size:12.5px;margin-top:3px;background:var(--frbg);border-radius:6px;padding:2px 8px;display:inline-block}
  .tip{margin-top:13px;background:var(--tipbg);border-radius:10px;padding:10px 13px;font-size:13.8px}
  .tip b{color:var(--tip)}
  .tts{border:none;background:transparent;cursor:pointer;font-size:13px;padding:0 3px;opacity:.5;vertical-align:baseline;line-height:1}
  .tts:hover{opacity:1;transform:scale(1.15)}
  .tts.playing{opacity:1;animation:pulse .8s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .practice{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}
  .practice .label{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .reveal{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:7px;padding:1px 8px;font-size:11.5px;cursor:pointer;font-weight:600;margin-left:6px;white-space:nowrap;vertical-align:baseline}
  .reveal:hover{background:var(--accent);color:#fff}
  .say-all{margin-left:auto;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:7px;padding:2px 9px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
  .say-all:hover{background:var(--accent);color:#fff}
  .say-all.playing{background:var(--accent);color:#fff;animation:pulse .8s infinite}
  .say-from{margin-left:6px;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:7px;padding:2px 9px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
  .say-from:hover{background:var(--accent);color:#fff}
  .say-from.playing{background:var(--accent);color:#fff;animation:pulse .8s infinite}
  .card.reading{box-shadow:0 0 0 2px var(--accent)}
  .tts-transport{display:inline-flex;gap:4px}
  .iconbtn:disabled{opacity:.4;cursor:default}
  .qs{margin:8px 0 0;padding-left:24px}
  .qs li{padding:5px 0}
  .qs .q{color:var(--ink);font-size:14.5px}
  .qs .a{margin-top:4px;color:#0a7d3c;background:var(--frbg);border-radius:6px;padding:5px 10px;font-weight:600;font-size:14px}
  html[data-theme="dark"] .qs .a{color:#5fcf89}
  .qs .anote{color:var(--muted);font-weight:400;font-size:12.5px}
  .hint{color:var(--muted);font-weight:400;font-size:.86em}
  .label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
  .hidden{display:none!important}
  .nores{color:var(--muted);padding:40px 0;text-align:center}
  /* mobile */
  #menuToggle{display:none}
  @media(max-width:820px){
    #sidebar{position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:.25s}
    #sidebar.open{transform:translateX(0)}
    #menuToggle{display:inline-block}
    .inner,.topbar .tb{padding-left:16px;padding-right:16px}
  }
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .scrim.open{display:block}
</style>
</head>
<body>
<div class="wrap">
  <aside id="sidebar"></aside>
  <div class="scrim" id="scrim"></div>
  <div id="main">
    <div class="topbar">
      <div class="tb">
        <button class="iconbtn" id="menuToggle">☰</button>
        <input id="search" type="search" placeholder="搜索语法点 / Rechercher (中文或法语)…" autocomplete="off">
        <div class="chips" id="chips">
          <span class="chip on" data-l="ALL">全部</span>
          <span class="chip" data-l="A1">A1</span>
          <span class="chip" data-l="A2">A2</span>
          <span class="chip" data-l="B1">B1</span>
          <span class="chip" data-l="B2">B2</span>
          <span class="chip" data-l="C1">C1</span>
          <span class="chip" data-l="C2">C2</span>
        </div>
        <select id="voiceSel" class="ctl" title="法语语音 / Voix française"></select>
        <button class="iconbtn" id="voiceTest" title="试听 / Tester la voix">▶</button>
        <span class="spd" title="语速 / Vitesse">🐢<input id="rate" type="range" min="0.5" max="1.4" step="0.05" value="0.95">🐇<b id="rateVal">0.95×</b></span>
        <span class="tts-transport" id="ttsBar"><button class="iconbtn" id="ttsPause" title="暂停 / Pause" disabled>⏸</button><button class="iconbtn" id="ttsStop" title="停止 / Arrêter" disabled>⏹</button></span>
        <button class="iconbtn" id="themeBtn" title="深色/浅色">🌓</button>
      </div>
    </div>
    <div class="inner">
      <div class="hero">
        <h1>法语语法手册 · Grammaire française A1–C2</h1>
        <p>覆盖 A1–C2 全部核心语法点,每点含<strong>中法双语讲解 + 例句 + 易错点 + 练习</strong>;法语内容均可点 🔊 朗读(TTS)。</p>
        <p>Tous les points de grammaire essentiels du niveau A1 au C2, avec explications bilingues, exemples, pièges, exercices et synthèse vocale (🔊).</p>
        <p class="count" id="count"></p>
      </div>
      <div id="content"></div>
      <div class="nores hidden" id="nores">没有匹配的语法点 · Aucun résultat</div>
    </div>
  </div>
</div>
<script src="audio/manifest.js"></script>
<script>
/* ============================================================
   数据结构 · 每个语法点:
   { id, level:"A1|A2|B1|B2", cat:"中文分类", catFr, title, titleFr,
     zh:"中文讲解", fr:"explication FR",
     forms?:"<table>…</table>",
     ex:[{fr,zh,use?}, …],   // use = 用法标注:该例句属于哪种用法及原因
     tip?:"易错点(中文为主)" }
   例句法语里用 <b>…</b> 高亮重点结构。
   ============================================================ */
const A1 = [
  // ---------- 名词与冠词 ----------
  { id:"a1-genre", level:"A1", cat:"名词与冠词", catFr:"Noms et articles",
    title:"L'article défini", titleFr:"L'article défini · 定冠词",
    zh:"法语每个名词都有<strong>阴阳性</strong>,且冠词必须与名词的性、数一致。定冠词指<strong>特指/已知/独一无二</strong>的事物:阳性 <b>le</b>、阴性 <b>la</b>、元音或哑音 h 前缩为 <b>l'</b>、复数一律 <b>les</b>。",
    fr:"Tout nom français a un genre (masculin/féminin). L'article défini (le, la, l', les) s'emploie pour une chose précise, connue ou unique.",
    forms:"<table><tr><th>阳性 m.</th><th>阴性 f.</th><th>元音/h 前</th><th>复数 pl.</th></tr><tr><td>le livre</td><td>la table</td><td>l'ami, l'heure</td><td>les livres</td></tr></table>",
    ex:[
      {fr:"<b>Le</b> soleil brille.", zh:"太阳照耀着。(独一无二)", use:"独一无二:le soleil 世上只有一个,属于独一无二的事物,须用定冠词"},
      {fr:"J'aime <b>la</b> musique.", zh:"我喜欢音乐。(泛指整类)", use:"泛指整类:aimer 后的 la musique 指音乐这一整类事物,泛指整类用定冠词"},
      {fr:"<b>Les</b> enfants jouent dans <b>le</b> parc.", zh:"孩子们在公园里玩。", use:"特指/已知:说话双方都知道是哪些孩子、哪个公园,已知事物用定冠词"},
      {fr:"Voilà <b>le</b> professeur de ma classe.", zh:"这就是我们班的老师。", use:"特指/已知:de ma classe 限定了是哪位老师,被限定的特指名词用定冠词"},
      {fr:"<b>L'</b>école est ouverte.", zh:"学校开门了。", use:"元音前缩写:école 以元音开头,le/la 一律缩写为 l'"},
      {fr:"Je vais <b>au</b> marché et je parle <b>du</b> film.", zh:"我去市场,谈论那部电影。", use:"缩合:定冠词与 à/de 相遇必须缩合,à+le=au,de+le=du"}
    ],
    tip:"<b>易错:</b>名词的阴阳性必须连词一起记(记 <em>une table</em> 而不是单记 table)。à/de + le/les 要缩合:<em>à+le=au, à+les=aux, de+le=du, de+les=des</em>。" },

  { id:"a1-indefini", level:"A1", cat:"名词与冠词", catFr:"Noms et articles",
    title:"L'article indéfini", titleFr:"L'article indéfini · 不定冠词",
    zh:"不定冠词指<strong>非特指、初次提到、可数</strong>的事物:阳性 <b>un</b>、阴性 <b>une</b>、复数 <b>des</b>。",
    fr:"L'article indéfini (un, une, des) désigne une chose non précise, mentionnée pour la première fois.",
    ex:[
      {fr:"C'est <b>un</b> livre et <b>une</b> revue.", zh:"这是一本书和一本杂志。", use:"非特指/初次提到:第一次提到的书和杂志,阳性用 un、阴性用 une"},
      {fr:"Il y a <b>des</b> étudiants dans la classe.", zh:"教室里有一些学生。", use:"复数非特指:一些不确定的学生,可数复数非特指用 des"},
      {fr:"Je n'ai pas <b>de</b> voiture.", zh:"我没有车。", use:"否定变 de:否定句中 un/une/des 通常变为 de"}
    ],
    tip:"<b>易错:</b>否定句中 un/une/des 通常变 <b>de</b>:<em>Je n'ai pas <b>de</b> voiture.</em>(我没有车。)" },

  { id:"a1-pluriel", level:"A1", cat:"名词与冠词", catFr:"Noms et articles",
    title:"Le pluriel des noms", titleFr:"Le pluriel des noms · 名词复数",
    zh:"名词复数一般在词尾加 <b>-s</b>(不发音)。特殊:-au/-eau/-eu → 加 <b>-x</b>;-al → 改 <b>-aux</b>;以 -s/-x/-z 结尾不变。",
    fr:"On forme généralement le pluriel en ajoutant -s. Cas particuliers : -eau→-eaux, -al→-aux, etc.",
    forms:"<table><tr><th>规则</th><th>单数</th><th>复数</th></tr><tr><td>一般 +s</td><td>un ami</td><td>des amis</td></tr><tr><td>-eau +x</td><td>un château</td><td>des châteaux</td></tr><tr><td>-al→-aux</td><td>un journal</td><td>des journaux</td></tr><tr><td>-s/-x 不变</td><td>un bus</td><td>des bus</td></tr></table>",
    ex:[
      {fr:"Les <b>animaux</b> du zoo.", zh:"动物园的动物们。(animal→animaux)", use:"-al 改 -aux:animal 以 -al 结尾,复数改为 animaux"},
      {fr:"J'ai deux <b>amis</b> français.", zh:"我有两个法国朋友。", use:"一般加 -s:ami 属一般情况,词尾直接加 -s(不发音)"},
      {fr:"Les <b>châteaux</b> de la Loire sont magnifiques.", zh:"卢瓦尔河的城堡非常壮观。", use:"-eau 加 -x:château 以 -eau 结尾,复数加 -x"},
      {fr:"Il y a deux <b>bus</b> devant la gare.", zh:"火车站前有两辆公交车。", use:"-s/-x/-z 结尾不变:bus 复数形式不变,靠 deux/les 等冠词数词判断单复数"}
    ],
    tip:"<b>易错:</b>复数 -s 不发音,口语靠<strong>冠词</strong>(le/les、un/des)区分单复数。" },

  { id:"a1-partitif", level:"A1", cat:"名词与冠词", catFr:"Noms et articles",
    title:"L'article partitif", titleFr:"L'article partitif · 部分冠词",
    zh:"部分冠词表示<strong>不可数/不定量</strong>的一部分:阳性 <b>du</b>、阴性 <b>de la</b>、元音前 <b>de l'</b>。常用于食物、抽象概念。",
    fr:"L'article partitif (du, de la, de l') exprime une quantité indéterminée d'une chose non comptable.",
    ex:[
      {fr:"Je bois <b>du</b> café et <b>de l'</b>eau.", zh:"我喝(一些)咖啡和水。", use:"不可数部分量:café 阳性用 du,eau 元音开头用 de l',表示喝的量不确定"},
      {fr:"Tu as <b>de la</b> chance !", zh:"你真走运!", use:"阴性/抽象概念:chance 是阴性抽象名词,不定量用 de la"},
      {fr:"Je ne mange pas <b>de</b> pain et je bois beaucoup <b>d'</b>eau.", zh:"我不吃面包,喝很多水。", use:"否定/数量词后用 de:pas de、beaucoup de 后部分冠词一律变 de(元音前 d')"},
      {fr:"J'aime <b>le</b> thé, mais ce soir je bois <b>du</b> café.", zh:"我喜欢茶,但今晚我喝咖啡。", use:"泛指与部分量对比:aimer 表泛指整类用定冠词 le,boire 表不定量用部分冠词 du"}
    ],
    tip:"<b>易错:</b>否定后及数量词后用 <b>de</b>:<em>pas <b>de</b> café、beaucoup <b>de</b> café</em>。对比:<em>J'aime <b>le</b> café</em>(泛指,用定冠词)vs <em>Je bois <b>du</b> café</em>(部分量)。" },

  // ---------- 代词与 être/avoir ----------
  { id:"a1-sujets", level:"A1", cat:"主语代词与系动词", catFr:"Pronoms sujets, être/avoir",
    title:"Les pronoms sujets", titleFr:"Les pronoms sujets · 主语人称代词",
    zh:"主语代词:<b>je</b>(我)、<b>tu</b>(你,熟人)、<b>il/elle/on</b>(他/她/我们口语)、<b>nous</b>(我们)、<b>vous</b>(您/你们)、<b>ils/elles</b>(他们/她们)。",
    fr:"Les pronoms sujets remplacent le sujet. « on » = « nous » à l'oral ; « vous » est aussi la forme de politesse.",
    ex:[
      {fr:"<b>Vous</b> parlez français ?", zh:"您说法语吗?(礼貌)", use:"vous 礼貌式:对不熟的人或长辈用 vous 表尊敬"},
      {fr:"<b>On</b> va au cinéma.", zh:"我们去看电影。(口语 on=nous)", use:"on=nous 口语:口语中 on 代替 nous,动词用第三人称单数"},
      {fr:"<b>Tu</b> es mon meilleur ami.", zh:"你是我最好的朋友。", use:"tu 用于熟人:朋友、家人之间用 tu 而非 vous"},
      {fr:"<b>J'</b>habite à Paris.", zh:"我住在巴黎。", use:"je 元音前缩写:habite 以哑音 h 开头,je 缩为 j'"},
      {fr:"Marie et Anna ? <b>Elles</b> chantent bien.", zh:"玛丽和安娜?她们唱得很好。", use:"ils/elles 区分性别:全部为女性时用 elles"}
    ],
    tip:"<b>易错:</b>je 在元音前缩为 j'(<em>j'habite</em>)。on 的动词永远用<strong>第三人称单数</strong>。" },

  { id:"a1-etre", level:"A1", cat:"主语代词与系动词", catFr:"Pronoms sujets, être/avoir",
    title:"Le verbe « être »", titleFr:"Le verbe « être » · 动词「是」",
    zh:"être(是)是最重要的动词之一,用于身份、国籍、职业、状态、形容词描述。",
    fr:"« Être » sert à exprimer l'identité, la nationalité, la profession, l'état.",
    forms:"<table><tr><td>je suis</td><td>nous sommes</td></tr><tr><td>tu es</td><td>vous êtes</td></tr><tr><td>il/elle est</td><td>ils/elles sont</td></tr></table>",
    ex:[
      {fr:"Je <b>suis</b> étudiant.", zh:"我是学生。(职业不加冠词)", use:"职业:être+职业名词且不加冠词"},
      {fr:"Nous <b>sommes</b> français.", zh:"我们是法国人。", use:"国籍:être+国籍形容词,与主语性数配合"},
      {fr:"C'est Paul, il <b>est</b> mon voisin.", zh:"这是保罗,他是我的邻居。", use:"身份:介绍某人是谁(我的邻居)用 être"},
      {fr:"Je <b>suis</b> fatigué et tu <b>es</b> content.", zh:"我累了,你很高兴。", use:"状态/形容词描述:fatigué、content 描述当前状态,用 être+形容词"}
    ],
    tip:"<b>易错:</b>表职业/国籍时形容词或名词<strong>不加冠词</strong>:<em>Il est médecin.</em>(他是医生。)" },

  { id:"a1-avoir", level:"A1", cat:"主语代词与系动词", catFr:"Pronoms sujets, être/avoir",
    title:"Le verbe « avoir »", titleFr:"Le verbe « avoir » · 动词「有」",
    zh:"avoir(有)表示拥有、年龄,也是大多数复合时态的助动词(见 A2 复合过去时)。",
    fr:"« Avoir » exprime la possession, l'âge, et sert d'auxiliaire aux temps composés.",
    forms:"<table><tr><td>j'ai</td><td>nous avons</td></tr><tr><td>tu as</td><td>vous avez</td></tr><tr><td>il/elle a</td><td>ils/elles ont</td></tr></table>",
    ex:[
      {fr:"J'<b>ai</b> vingt ans.", zh:"我二十岁。(年龄用 avoir,不用 être!)", use:"年龄:法语说年龄用 avoir(『有』二十岁),绝不用 être"},
      {fr:"Elle <b>a</b> deux frères.", zh:"她有两个兄弟。", use:"拥有:表示她有两个兄弟,所属关系用 avoir"},
      {fr:"Nous <b>avons</b> une grande maison.", zh:"我们有一座大房子。", use:"拥有:avons 表示我们拥有房子,注意与主语 nous 的变位"}
    ],
    tip:"<b>易错:</b>年龄用 avoir 不用 être——中文「我<em>是</em>20岁」≠ 法语,法语是「我<em>有</em>20岁」。" },

  { id:"a1-cest-ilya", level:"A1", cat:"主语代词与系动词", catFr:"Pronoms sujets, être/avoir",
    title:"« c'est » et « il y a »", titleFr:"« c'est » / « il y a » · 这是/有",
    zh:"<b>c'est</b>(这是)用于指认、介绍;<b>il y a</b>(有)表示存在。复数 <em>ce sont</em>。",
    fr:"« C'est » présente ou identifie ; « il y a » indique l'existence (invariable).",
    ex:[
      {fr:"<b>C'est</b> mon ami Paul.", zh:"这是我的朋友保罗。", use:"c'est 指认/介绍:向别人介绍某人是谁用 c'est"},
      {fr:"<b>Il y a</b> un problème.", zh:"有一个问题。", use:"il y a 存在:表示『有/存在』一个问题"},
      {fr:"Dans la ville, <b>il y a</b> beaucoup de musées.", zh:"城里有很多博物馆。", use:"il y a 永远不变:即使后面是复数 musées,il y a 形式也不变"},
      {fr:"<b>Ce sont</b> mes parents.", zh:"这是我的父母。", use:"复数 ce sont:后面是复数名词 mes parents,c'est 要变成 ce sont"},
      {fr:"<b>C'est</b> un médecin. / Il <b>est</b> médecin.", zh:"这是一位医生。/ 他是医生。", use:"c'est 与 il est 对比:c'est+冠词+名词,il est+职业(不加冠词)"}
    ],
    tip:"<b>易错:</b>il y a 永远不变(没有复数 *il y ont*)。c'est vs il est:<em>C'est un médecin</em>(c'est+冠词+名词)/ <em>Il est médecin</em>(il est+职业)。" },

  // ---------- 现在时 ----------
  { id:"a1-present-er", level:"A1", cat:"直陈式现在时", catFr:"Le présent de l'indicatif",
    title:"Le présent : verbes en -ER", titleFr:"现在时:第一组动词 -ER",
    zh:"第一组动词(占 90%)去掉 -er,加词尾 <b>-e, -es, -e, -ons, -ez, -ent</b>。现在时表示当前、习惯、普遍真理。",
    fr:"1er groupe (-er) : on retire -er et on ajoute les terminaisons. Le présent exprime une action actuelle, habituelle ou générale.",
    forms:"<table><tr><th>parler 说</th><th></th></tr><tr><td>je parle</td><td>nous parlons</td></tr><tr><td>tu parles</td><td>vous parlez</td></tr><tr><td>il parle</td><td>ils parlent</td></tr></table>",
    ex:[
      {fr:"Nous <b>habitons</b> à Paris.", zh:"我们住在巴黎。", use:"习惯/常态:住在巴黎是长期状态,用现在时表达"},
      {fr:"Ils <b>regardent</b> la télé.", zh:"他们在看电视。", use:"当前动作:此刻正在做的事,法语用现在时表『正在』"},
      {fr:"La Terre <b>tourne</b> autour du Soleil.", zh:"地球绕着太阳转。", use:"普遍真理:客观规律永远成立,用现在时"}
    ],
    tip:"<b>易错:</b>-e, -es, -ent 词尾都<strong>不发音</strong>,三个发音相同(je/tu/ils parle(s/nt))。" },

  { id:"a1-present-ir", level:"A1", cat:"直陈式现在时", catFr:"Le présent de l'indicatif",
    title:"Le présent : verbes en -IR", titleFr:"现在时:第二组动词 -IR",
    zh:"第二组动词(如 finir)词尾 <b>-is, -is, -it, -issons, -issez, -issent</b>,复数有特征性的 <b>-iss-</b>。",
    fr:"2e groupe (-ir, type finir) : présence de l'infixe -iss- au pluriel.",
    forms:"<table><tr><th>finir 完成</th><th></th></tr><tr><td>je finis</td><td>nous finissons</td></tr><tr><td>tu finis</td><td>vous finissez</td></tr><tr><td>il finit</td><td>ils finissent</td></tr></table>",
    ex:[
      {fr:"Je <b>finis</b> mon travail.", zh:"我完成我的工作。", use:"单数变位:je/tu 词尾 -is、il 词尾 -it,单数没有 -iss-"},
      {fr:"Les fleurs <b>grandissent</b> vite.", zh:"花长得很快。", use:"复数 -iss-:第二组动词复数带特征性 -iss-(grandissent)"},
      {fr:"Vous <b>choisissez</b> un dessert ?", zh:"你们选一份甜点吗?", use:"复数 -iss-:choisir 的 vous 形式 choisissez 同样带 -iss-"},
      {fr:"Attention : <b>partir</b> → je pars, nous partons.", zh:"注意:partir 是第三组,变位没有 -iss-。", use:"辨别第三组:partir/dormir/venir 虽以 -ir 结尾但不属第二组,复数无 -iss-"}
    ],
    tip:"<b>易错:</b>不是所有 -ir 动词都是第二组!<em>partir, dormir, venir</em> 属第三组(不规则),没有 -iss-。" },

  { id:"a1-present-irreg", level:"A1", cat:"直陈式现在时", catFr:"Le présent de l'indicatif",
    title:"Verbes irréguliers fréquents", titleFr:"常见不规则动词(第三组)",
    zh:"高频不规则动词必须单独记。最常用:<b>aller</b>(去)、<b>faire</b>(做)、<b>prendre</b>(拿/乘)、<b>venir</b>(来)、<b>pouvoir</b>(能)、<b>vouloir</b>(想)、<b>devoir</b>(应该)。",
    fr:"Les verbes irréguliers les plus fréquents doivent être mémorisés un par un.",
    forms:"<table><tr><th></th><th>aller</th><th>faire</th><th>prendre</th></tr><tr><td>je</td><td>vais</td><td>fais</td><td>prends</td></tr><tr><td>tu</td><td>vas</td><td>fais</td><td>prends</td></tr><tr><td>il</td><td>va</td><td>fait</td><td>prend</td></tr><tr><td>nous</td><td>allons</td><td>faisons</td><td>prenons</td></tr><tr><td>vous</td><td>allez</td><td>faites</td><td>prenez</td></tr><tr><td>ils</td><td>vont</td><td>font</td><td>prennent</td></tr></table>",
    ex:[
      {fr:"Je <b>vais</b> à l'école, tu <b>fais</b> tes devoirs.", zh:"我去学校,你做作业。", use:"aller 与 faire:vais/fais 均为高频不规则变位,须整体记忆"},
      {fr:"Nous <b>prenons</b> le bus.", zh:"我们乘公交。", use:"prendre:词干变化不规则(prends/prenons/prennent)"},
      {fr:"Ils <b>viennent</b> de Chine.", zh:"他们来自中国。", use:"venir:变位不规则(viens/venons/viennent),复数双写 n"},
      {fr:"Je <b>peux</b> venir, mais elle <b>veut</b> rester.", zh:"我能来,但她想留下。", use:"pouvoir 与 vouloir:peux/veut 均为不规则变位,常与动词原形连用"},
      {fr:"Tu <b>dois</b> écouter le professeur.", zh:"你应该听老师的。", use:"devoir:dois/devons/doivent 不规则,表义务"},
      {fr:"Vous <b>faites</b> du sport ?", zh:"你们做运动吗?", use:"特殊 vous 形式:faites 不以 -ez 结尾(同类还有 dites、êtes)"}
    ],
    tip:"<b>易错:</b><em>vous faites</em>、<em>vous dites</em>、<em>vous êtes</em> 是少数不以 -ez 结尾的 vous 形式。" },

  // ---------- 形容词 ----------
  { id:"a1-adj", level:"A1", cat:"形容词", catFr:"Les adjectifs",
    title:"L'accord et la place de l'adjectif", titleFr:"形容词的配合与位置",
    zh:"品质形容词与名词<strong>性数一致</strong>:阴性一般 +e,复数 +s。位置:<strong>多数后置</strong>;少数<strong>短而常用</strong>的形容词前置:<b>beau, joli, grand, petit, gros, jeune, nouveau, vieux, bon, mauvais, long</b>(表示美丑、大小、新旧、好坏、年龄等)。",
    fr:"L'adjectif qualificatif s'accorde en genre et en nombre. La plupart se placent après le nom ; quelques-uns (petits et courants) avant.",
    forms:"<table><tr><th>阳单</th><th>阴单</th><th>阳复</th><th>阴复</th></tr><tr><td>grand</td><td>grande</td><td>grands</td><td>grandes</td></tr><tr><td>heureux</td><td>heureuse</td><td>heureux</td><td>heureuses</td></tr></table>",
    ex:[
      {fr:"une <b>petite</b> maison <b>blanche</b>", zh:"一座白色的小房子(petit 前置,blanc 后置)", use:"位置对比:petit 属短而常用的前置形容词,blanche(颜色)后置,两者都与 maison 阴性配合"},
      {fr:"des étudiants <b>intelligents</b>", zh:"聪明的学生们", use:"性数配合+一般后置:intelligent 加 -s 与复数名词配合,普通形容词后置"},
      {fr:"une histoire <b>heureuse</b>", zh:"一个幸福的故事(heureux→heureuse)", use:"阴性配合:heureux 属 -eux→-euse 的特殊阴性变化"},
      {fr:"un <b>grand</b> homme ≠ un homme <b>grand</b>", zh:"一位伟人 ≠ 一个高个子男人", use:"前后置意义不同:grand 前置表『伟大的』,后置表『高大的』"}
    ],
    tip:"<b>易错:</b>有些形容词前置/后置<strong>意义不同</strong>:<em>un <b>grand</b> homme</em>(伟人)vs <em>un homme <b>grand</b></em>(高个子)。" },

  { id:"a1-possessif", level:"A1", cat:"形容词", catFr:"Les adjectifs",
    title:"Les adjectifs possessifs", titleFr:"主有形容词(物主)",
    zh:"主有形容词与<strong>被拥有物</strong>的性数一致(不是与拥有者!):mon/ma/mes(我的)、ton/ta/tes、son/sa/ses、notre/nos、votre/vos、leur/leurs。",
    fr:"L'adjectif possessif s'accorde avec l'objet possédé, pas avec le possesseur.",
    forms:"<table><tr><th></th><th>阳单</th><th>阴单</th><th>复数</th></tr><tr><td>我的</td><td>mon</td><td>ma</td><td>mes</td></tr><tr><td>你的</td><td>ton</td><td>ta</td><td>tes</td></tr><tr><td>他/她的</td><td>son</td><td>sa</td><td>ses</td></tr></table>",
    ex:[
      {fr:"<b>son</b> père et <b>sa</b> mère", zh:"他/她的父亲和母亲(son/sa 不分他/她!)", use:"与被拥有物配合:père 阳性用 son、mère 阴性用 sa,与拥有者的性别无关"},
      {fr:"<b>mon</b> amie", zh:"我的(女性)朋友(阴性名词以元音开头用 mon,非 ma)", use:"元音前用 mon:amie 虽是阴性但以元音开头,用 mon 代替 ma"},
      {fr:"<b>Leur</b> maison est grande et <b>leurs</b> enfants sont petits.", zh:"他们的房子很大,他们的孩子还小。", use:"复数拥有者:leur+单数被拥有物、leurs+复数被拥有物,依被拥有物的数配合"}
    ],
    tip:"<b>易错:</b>son/sa 不区分「他的/她的」,只看名词性别。阴性名词若以<strong>元音</strong>开头,用 mon/ton/son(<em>mon école</em>)。" },

  { id:"a1-demonstratif", level:"A1", cat:"形容词", catFr:"Les adjectifs",
    title:"Les adjectifs démonstratifs", titleFr:"指示形容词(这/那)",
    zh:"指示形容词「这/那」:阳性 <b>ce</b>、元音前 <b>cet</b>、阴性 <b>cette</b>、复数 <b>ces</b>。",
    fr:"L'adjectif démonstratif (ce, cet, cette, ces) désigne ce que l'on montre.",
    ex:[
      {fr:"<b>Ce</b> livre, <b>cet</b> arbre, <b>cette</b> femme, <b>ces</b> enfants.", zh:"这本书、这棵树、这个女人、这些孩子。", use:"四种形式总览:ce+阳性单数、cet+元音前、cette+阴性单数、ces+复数"},
      {fr:"<b>Ce</b> café est très bon.", zh:"这杯咖啡很好喝。", use:"阳性单数用 ce:café 阳性且以辅音开头"},
      {fr:"<b>Cet</b> hôtel est cher.", zh:"这家旅馆很贵。", use:"元音/哑音 h 前用 cet:hôtel 以哑音 h 开头,ce 变 cet"},
      {fr:"J'adore <b>cette</b> chanson.", zh:"我特别喜欢这首歌。", use:"阴性单数用 cette:chanson 是阴性名词"},
      {fr:"<b>Ces</b> photos sont belles.", zh:"这些照片很美。", use:"复数一律用 ces:不分阴阳性"}
    ],
    tip:"<b>易错:</b>阳性名词以元音/哑音 h 开头时用 <b>cet</b>(<em>cet homme, cet hôtel</em>),发音与 cette 相同。" },

  // ---------- 疑问与否定 ----------
  { id:"a1-negation", level:"A1", cat:"疑问与否定", catFr:"Interrogation et négation",
    title:"La négation « ne… pas »", titleFr:"否定 ne… pas",
    zh:"基本否定把动词夹在 <b>ne… pas</b> 之间(ne 在元音前缩为 n')。",
    fr:"La négation de base encadre le verbe : ne + verbe + pas.",
    ex:[
      {fr:"Je <b>ne</b> parle <b>pas</b> anglais.", zh:"我不说英语。", use:"基本否定:ne 和 pas 前后夹住变位动词 parle"},
      {fr:"Il <b>n'</b>aime <b>pas</b> le café.", zh:"他不喜欢咖啡。", use:"元音前缩写:aime 以元音开头,ne 缩为 n';泛指的 le café 保留定冠词"},
      {fr:"Nous n'avons <b>pas de</b> chat.", zh:"我们没有猫。", use:"否定后冠词变 de:un/une/des、du/de la 在 pas 之后一律变 de"}
    ],
    tip:"<b>易错:</b>否定后不定冠词/部分冠词变 de:<em>Je n'ai <b>pas de</b> voiture.</em> 口语中 ne 常被省略(<em>Je sais pas</em>),但书面必须保留。" },

  { id:"a1-question", level:"A1", cat:"疑问与否定", catFr:"Interrogation et négation",
    title:"Les trois formes de questions", titleFr:"疑问句的三种形式",
    zh:"是非问句三种:①<strong>语调</strong>(口语,陈述句末升调)②<strong>est-ce que</strong>(中性)③<strong>倒装</strong>(正式,主谓倒置加连字符)。",
    fr:"Trois registres pour l'interrogation totale : intonation (familier), est-ce que (standard), inversion (soutenu).",
    ex:[
      {fr:"Tu viens ? / <b>Est-ce que</b> tu viens ? / <b>Viens-tu</b> ?", zh:"你来吗?(三种:口语/中性/正式)", use:"三种形式总览:语调式(口语)、est-ce que(中性)、倒装(正式)"},
      {fr:"<b>Aimez-vous</b> la France ?", zh:"您喜欢法国吗?(倒装)", use:"倒装式:正式语体,动词与主语代词倒置并加连字符"},
      {fr:"<b>A-t-il</b> une voiture ?", zh:"他有车吗?(倒装加 -t-)", use:"倒装加 -t-:动词 a 以元音结尾,与 il 之间插入 -t- 便于发音"}
    ],
    tip:"<b>易错:</b>倒装时若第三人称动词以元音结尾,加 <strong>-t-</strong>:<em>A-<b>t</b>-il</em>、<em>Parle-<b>t</b>-elle</em>。" },

  { id:"a1-mots-interro", level:"A1", cat:"疑问与否定", catFr:"Interrogation et négation",
    title:"Les mots interrogatifs", titleFr:"疑问词",
    zh:"常用疑问词:<b>qui</b>(谁)、<b>que/quoi</b>(什么)、<b>où</b>(哪里)、<b>quand</b>(何时)、<b>comment</b>(怎样)、<b>combien</b>(多少)、<b>pourquoi</b>(为什么)、<b>quel(le)</b>(哪个/什么样的)。",
    fr:"Les mots interrogatifs introduisent une question partielle.",
    ex:[
      {fr:"<b>Où</b> habites-tu ? <b>Quand</b> arrives-tu ?", zh:"你住哪儿?你何时到?", use:"où 问地点、quand 问时间"},
      {fr:"<b>Quelle</b> heure est-il ?", zh:"几点了?(quel 与名词配合)", use:"quel 疑问形容词:与阴性名词 heure 配合为 quelle"},
      {fr:"<b>Qui</b> est-ce ? <b>Que</b> fais-tu ?", zh:"这是谁?你在做什么?", use:"qui 问人、que 问事物"},
      {fr:"<b>Comment</b> tu t'appelles ? <b>Combien</b> ça coûte ?", zh:"你叫什么名字?这个多少钱?", use:"comment 问方式、combien 问数量/价格"},
      {fr:"<b>Pourquoi</b> tu pleures ? — Parce que je suis triste.", zh:"你为什么哭?——因为我难过。", use:"pourquoi 问原因:回答常用 parce que"}
    ],
    tip:"<b>易错:</b>quel 是<strong>疑问形容词</strong>,要与名词性数配合:quel/quelle/quels/quelles。" },

    fr:"Le subjonctif exprime la subjectivité. Radical = 3e personne pluriel du présent (ils) + terminaisons.",
    forms:"<table><tr><th>规则(parler)</th><th>不规则</th></tr><tr><td>que je parle</td><td>être: que je sois</td></tr><tr><td>que tu parles</td><td>avoir: que j'aie</td></tr><tr><td>que nous parlions</td><td>aller: que j'aille</td></tr><tr><td>qu'ils parlent</td><td>faire: que je fasse / pouvoir: puisse / savoir: sache</td></tr></table>",
    ex:[
      {fr:"Il faut que tu <b>fasses</b> tes devoirs.", zh:"你必须做作业。", use:"必要触发(il faut que):不规则动词 faire → que tu fasses"},
      {fr:"Je veux que vous <b>soyez</b> à l'heure.", zh:"我要你们准时。", use:"意愿触发(vouloir que):不规则动词 être → que vous soyez"},
      {fr:"Il est important que nous <b>parlions</b> de ce problème.", zh:"重要的是我们谈一谈这个问题。", use:"规则构成(nous/vous):parler → que nous parlions,词尾 -ions/-iez 形同 imparfait"},
      {fr:"Il faut que j'<b>aille</b> à la banque avant midi.", zh:"我得在中午前去一趟银行。", use:"不规则动词(aller):que j'aille,六大不规则虚拟式之一,必须硬记"}
    ],
    tip:"<b>易错:</b>必须记牢 être/avoir/aller/faire/pouvoir/savoir/vouloir 的不规则虚拟式——B2 的虚拟式过去时建在这之上。" },

  { id:"b1-subj-declencheurs", level:"B1", cat:"虚拟式现在时", catFr:"Le subjonctif présent",
    title:"Les déclencheurs du subjonctif", titleFr:"触发虚拟式的词 ⭐",
    zh:"虚拟式不是「随便用」,而是被特定结构<strong>触发</strong>。四大类 + 连词:①意愿(vouloir/souhaiter que)②情感(être content/avoir peur que)③怀疑/否定(douter que, ne pas penser que)④必要/判断(il faut que, il est important que)。",
    fr:"Le subjonctif est déclenché par : volonté, émotion, doute, nécessité/jugement, et certaines conjonctions.",
    forms:"<table><tr><th>类别</th><th>触发词</th></tr><tr><td>意愿</td><td>vouloir que, souhaiter que, exiger que</td></tr><tr><td>情感</td><td>être content/triste que, avoir peur que, regretter que</td></tr><tr><td>怀疑/必要</td><td>douter que, il faut que, il est possible que</td></tr><tr><td>连词</td><td>bien que, pour que, avant que, à condition que, jusqu'à ce que, à moins que</td></tr></table>",
    ex:[
      {fr:"<b>Bien qu'</b>il <b>soit</b> fatigué, il travaille.", zh:"尽管他累了,他还在工作。", use:"连词触发(bien que):让步连词后必须用虚拟式"},
      {fr:"Je reste <b>jusqu'à ce que</b> tu <b>reviennes</b>.", zh:"我待到你回来为止。", use:"连词触发(jusqu'à ce que):时间连词『直到』后接虚拟式"},
      {fr:"Je souhaite que tu <b>réussisses</b> ton examen.", zh:"我希望你考试成功。", use:"意愿类:souhaiter que + 虚拟式(对比:espérer que 接直陈式)"},
      {fr:"J'ai peur qu'il <b>pleuve</b> demain.", zh:"我怕明天会下雨。", use:"情感类:avoir peur que + 虚拟式,pleuvoir → pleuve"},
      {fr:"Je ne pense pas que ce <b>soit</b> une bonne idée.", zh:"我不认为这是个好主意。", use:"怀疑/否定类:penser que 在否定/疑问时改用虚拟式"},
      {fr:"Il est possible qu'elle <b>vienne</b> plus tard.", zh:"她有可能晚一点来。", use:"必要/判断类:il est possible que + 虚拟式"},
      {fr:"J'espère que tu <b>iras</b> mieux demain.", zh:"我希望你明天好一些。(espérer + 直陈式!)", use:"对比(espérer+直陈式):espérer que 不触发虚拟,接直陈式(此处为将来时)"}
    ],
    tip:"<b>关键对比:</b>espérer que + <strong>直陈式</strong>(j'espère qu'il viendra !),但 souhaiter que + 虚拟式。penser que 肯定用直陈,否定/疑问用虚拟。" },

  // ---------- 假设句 ----------
  { id:"b1-si", level:"B1", cat:"假设句 si", catFr:"L'hypothèse avec « si »",
    title:"Les trois types de phrases avec « si »", titleFr:"si 假设句三型 ⭐",
    zh:"<b>三种固定搭配,绝不能在 si 从句里用条件式!</b>①<strong>真实/可能</strong>:si+现在时 → 将来时;②<strong>现在的非真实</strong>:si+未完成过去 → 条件式现在;③<strong>过去的非真实</strong>:si+愈过去时 → 条件式过去。",
    fr:"Trois constructions hypothétiques. Jamais de conditionnel directement après « si » !",
    forms:"<table><tr><th>型</th><th>si 从句</th><th>主句</th></tr><tr><td>①可能</td><td>si + présent</td><td>futur</td></tr><tr><td>②现在非真实</td><td>si + imparfait</td><td>conditionnel présent</td></tr><tr><td>③过去非真实</td><td>si + plus-que-parfait</td><td>conditionnel passé</td></tr></table>",
    ex:[
      {fr:"<b>Si</b> j'ai le temps, je <b>viendrai</b>.", zh:"①如果我有空,我会来。", use:"第①型(真实/可能):si + 现在时,主句将来时,条件确有可能实现"},
      {fr:"<b>Si</b> j'avais le temps, je <b>viendrais</b>.", zh:"②(其实没空)如果我有空,我就来了。", use:"第②型(现在非真实):si + imparfait,主句条件式现在,与现状相反"},
      {fr:"<b>Si</b> j'avais eu le temps, je <b>serais venu</b>.", zh:"③(当时没空)我要是有空就来了。", use:"第③型(过去非真实):si + 愈过去时,主句条件式过去,过去已无法改变"}
    ],
    tip:"<b>最高频错误:</b>*Si je serais riche…* ✗ → 应为 <em>Si j'<b>étais</b> riche…</em>。si 后只能是现在时/未完成过去/愈过去时。" },

  // ---------- 间接引语 / 被动 ----------
  { id:"b1-discours-indirect", level:"B1", cat:"间接引语", catFr:"Le discours indirect",
    title:"Le discours indirect (au présent)", titleFr:"间接引语(现在)",
    zh:"转述他人话语。陈述句用 <b>que</b>;是非问用 <b>si</b>;特殊疑问保留疑问词(quoi→<b>ce que</b>);命令用 <b>de + 原形</b>。人称、时间、指示词随之改变。",
    fr:"Rapporter les paroles : que (déclaration), si (question oui/non), ce que (quoi), de + infinitif (ordre).",
    ex:[
      {fr:"Il dit : « Je suis fatigué » → Il dit <b>qu'</b>il est fatigué.", zh:"他说他累了。", use:"陈述句(que):陈述内容用 que 引导,人称随说话人改变"},
      {fr:"Elle demande : « Tu viens ? » → Elle demande <b>si</b> je viens.", zh:"她问我来不来。", use:"是非问(si):是非问改用 si 引导,恢复正常语序"},
      {fr:"« Sors ! » → Il me dit <b>de</b> sortir.", zh:"他让我出去。", use:"命令(de+原形):命令式转述为 dire de + 动词原形"},
      {fr:"Elle me demande : « Où habites-tu ? » → Elle me demande <b>où</b> j'habite.", zh:"她问我住在哪里。", use:"特殊疑问(保留疑问词):où/quand/pourquoi 等直接保留,从句不再倒装"},
      {fr:"« Qu'est-ce que tu veux ? » → Il demande <b>ce que</b> je veux.", zh:"他问我想要什么。", use:"特殊疑问(quoi→ce que):qu'est-ce que / que 在间接引语中变为 ce que"}
    ],
    tip:"<b>易错:</b>「什么」在间接引语里:Qu'est-ce que tu fais ? → Il demande <b>ce que</b> je fais。主句过去时要做时态后移(见 B2 时态呼应)。" },

  { id:"b1-passif", level:"B1", cat:"被动语态", catFr:"La voix passive",
    title:"La voix passive", titleFr:"被动语态",
    zh:"被动:<b>être</b>(与原时态一致)+ <strong>过去分词</strong>(与主语配合)+ <b>par</b>(施动者)。时态由 être 承担。",
    fr:"Passif = être (au temps voulu) + participe passé accordé avec le sujet + par + agent.",
    ex:[
      {fr:"Le voleur <b>a été arrêté par</b> la police.", zh:"小偷被警察抓了。", use:"基本构成(par):être 的复合过去时 + 过去分词 + par 引出施动者"},
      {fr:"Cette maison <b>est construite</b> en pierre.", zh:"这房子是石头建的。", use:"分词配合:主语 maison 阴性 → construite;施动者不重要时可省略"},
      {fr:"Les résultats <b>seront annoncés</b> demain.", zh:"结果将于明天公布。", use:"时态由 être 承担:将来时被动 = être 的将来时 seront + 过去分词"},
      {fr:"Ce professeur est <b>respecté de</b> tous ses élèves.", zh:"这位老师受到所有学生的尊敬。", use:"施动者用 de:感受/状态类动词(aimé, respecté, connu…)常用 de 而非 par"}
    ],
    tip:"<b>易错:</b>只有<strong>及物动词</strong>(带直接宾语)能变被动。感受/状态有时用 <b>de</b> 而非 par(<em>aimé <b>de</b> tous</em>)。" },

  // ---------- 代词进阶 ----------
  { id:"b1-double-pronoms", level:"B1", cat:"代词进阶", catFr:"Pronoms : approfondissement",
    title:"L'ordre des doubles pronoms", titleFr:"双代词的语序",
    zh:"两个宾语代词同时出现时,语序固定:<b>me/te/se/nous/vous</b> → <b>le/la/les</b> → <b>lui/leur</b> → <b>y</b> → <b>en</b>。",
    fr:"Ordre des pronoms compléments : me te se nous vous / le la les / lui leur / y / en.",
    forms:"<table><tr><td>me te se<br>nous vous</td><td>le la les</td><td>lui leur</td><td>y</td><td>en</td></tr></table>",
    ex:[
      {fr:"Il me donne le livre → Il <b>me le</b> donne.", zh:"他把书给我 → 他把它给我。", use:"第一组语序:me/te/nous/vous 排在 le/la/les 之前"},
      {fr:"Tu donnes les clés à Paul ? → Tu <b>les lui</b> donnes ?", zh:"你把钥匙给保罗?→ 你把它们给他?", use:"第二组语序:le/la/les 排在 lui/leur 之前"},
      {fr:"Il me donne du café → Il <b>m'en</b> donne.", zh:"他给我咖啡 → 他给我(一些)。", use:"en 殿后:部分冠词宾语 → en,永远排在所有代词之后"},
      {fr:"Donne-<b>les-moi</b> !", zh:"把它们给我!", use:"肯定命令式:代词后置且顺序改变,直接宾语在前,me → moi"}
    ],
    tip:"<b>易错:</b>肯定命令式语序不同且后置:<em>Donne-<b>les-moi</b> !</em>(把它们给我!)" },

  { id:"b1-possessifs-pron", level:"B1", cat:"代词进阶", catFr:"Pronoms : approfondissement",
    title:"Les pronoms possessifs", titleFr:"主有代词(le mien…)",
    zh:"代替「主有形容词+名词」,避免重复:<b>le mien/la mienne</b>(我的)、le tien、le sien、le nôtre、le vôtre、le leur,与所指名词性数一致。",
    fr:"Le pronom possessif remplace « adjectif possessif + nom » : le mien, le tien, le sien, le nôtre, le vôtre, le leur.",
    ex:[
      {fr:"C'est ta voiture ? — Non, c'est <b>la sienne</b>.", zh:"这是你的车吗?——不,是他/她的。", use:"基本替代:与 voiture 阴性单数配合 → la sienne,不区分他/她"},
      {fr:"Mes idées et <b>les tiennes</b>.", zh:"我的想法和你的。", use:"性数配合:idées 阴性复数 → les tiennes"},
      {fr:"Je parle de mon projet, et lui parle <b>du sien</b>.", zh:"我谈我的计划,他谈他的。", use:"缩合(de+le sien→du sien):主有代词的定冠词与 de 缩合"}
    ],
    tip:"<b>易错:</b>带定冠词,会与 à/de 缩合:<em>Je préfère mon vélo <b>au tien</b></em>(à+le tien)。" },

  { id:"b1-demonstratifs-pron", level:"B1", cat:"代词进阶", catFr:"Pronoms : approfondissement",
    title:"Les pronoms démonstratifs", titleFr:"指示代词(celui…)",
    zh:"<b>celui/celle/ceux/celles</b>(这个/那个),后常接 <b>-ci/-là</b>、<b>de+名词</b>、或关系从句(qui/que/dont)。中性:<b>ce/ceci/cela/ça</b>。",
    fr:"Pronoms démonstratifs : celui, celle, ceux, celles (+ -ci/-là, de…, qui/que…). Neutres : ce, ceci, cela, ça.",
    ex:[
      {fr:"Quel livre ? — <b>Celui de</b> Marie.", zh:"哪本书?——玛丽的那本。", use:"celui de + 名词(所属):玛丽的那本,de 表所属关系"},
      {fr:"<b>Ceux qui</b> veulent partir peuvent.", zh:"想走的人可以走。", use:"celui + 关系从句:ceux qui = 那些…的人,后接 qui/que/dont"},
      {fr:"Quelle robe préfères-tu ? — <b>Celle-ci</b> ou <b>celle-là</b> ?", zh:"你喜欢哪条裙子?——这条还是那条?", use:"-ci/-là(近指/远指):与 robe 阴性单数配合 → celle-ci / celle-là"},
      {fr:"<b>Cela</b> ne m'intéresse pas.", zh:"这(件事)我不感兴趣。", use:"中性代词:cela/ça 指代整件事或整个情况,不指具体名词"}
    ],
    tip:"<b>用途:</b><em>celui de</em> 表所属、<em>celui qui/que</em> 引出从句——议论文里指代上文非常好用。" },

  { id:"b1-dont", level:"B1", cat:"代词进阶", catFr:"Pronoms : approfondissement",
    title:"Le pronom relatif « dont »", titleFr:"关系代词 dont ⭐",
    zh:"<b>dont</b> 替代结构中带 <b>de</b> 的成分:de 引导的动词补语(parler <b>de</b>、avoir besoin <b>de</b>)、所属关系(「…的」)、数量。",
    fr:"« dont » remplace un complément introduit par « de » (verbe + de, possession, quantité).",
    ex:[
      {fr:"Le livre <b>dont</b> je t'ai parlé.", zh:"我跟你说过的那本书。(parler de)", use:"动词 + de(parler de):de 引导的动词补语 → dont"},
      {fr:"L'homme <b>dont</b> la voiture est rouge.", zh:"那辆车是红色的男人。(所属:他的车)", use:"所属(…的):sa voiture → dont la voiture,语序为 dont + 主语 + 动词"},
      {fr:"Il a trois enfants, <b>dont</b> deux filles.", zh:"他有三个孩子,其中两个是女儿。", use:"数量(其中):dont + 数词 = 其中…,表示整体中的一部分"},
      {fr:"Voici le travail <b>dont</b> je suis fier.", zh:"这是我引以为豪的工作。", use:"形容词 + de(être fier de):形容词搭配 de 的补语同样用 dont"}
    ],
    tip:"<b>易错:</b>普遍薄弱!凡是动词/形容词搭配 <b>de</b>(avoir besoin de, être fier de, s'occuper de)都用 dont。语序:dont + 主语 + 动词。" },

  // ---------- 非谓语 / 否定 / 连接 ----------
  { id:"b1-gerondif", level:"B1", cat:"副动词与否定", catFr:"Gérondif et négations",
    title:"Le gérondif", titleFr:"副动词(en + 现在分词)",
    zh:"<b>en</b> + 现在分词(nous 词干+<b>-ant</b>),表示<strong>同时、方式、条件</strong>。<strong>主语必须与主句相同</strong>。",
    fr:"Gérondif = « en » + participe présent. Exprime la simultanéité, la manière ou la condition. Même sujet que le verbe principal.",
    ex:[
      {fr:"Il chante <b>en travaillant</b>.", zh:"他一边工作一边唱歌。(同时)", use:"同时:两个动作同时进行,『一边…一边』"},
      {fr:"<b>En cherchant</b> bien, tu trouveras.", zh:"好好找的话,你会找到的。(条件)", use:"条件:相当于 si tu cherches bien,『…的话』"},
      {fr:"Elle a appris le français <b>en écoutant</b> la radio.", zh:"她通过听广播学会了法语。", use:"方式:回答『怎么做到的』,表示手段或方法"}
    ],
    tip:"<b>易错:</b>三个不规则现在分词:être→<b>étant</b>,avoir→<b>ayant</b>,savoir→<b>sachant</b>。" },

  { id:"b1-negations", level:"B1", cat:"副动词与否定", catFr:"Gérondif et négations",
    title:"Les négations complexes", titleFr:"复杂否定",
    zh:"除 ne…pas 外:<b>ne…plus</b>(不再)、<b>ne…jamais</b>(从不)、<b>ne…rien</b>(什么都不)、<b>ne…personne</b>(没人)、<b>ne…que</b>(只,=seulement,其实是限制非否定)、<b>ne…aucun(e)</b>(没有任何)。",
    fr:"ne…plus, ne…jamais, ne…rien, ne…personne, ne…que (restriction = seulement), ne…aucun.",
    ex:[
      {fr:"Je <b>ne</b> bois <b>que</b> de l'eau.", zh:"我只喝水。(ne…que=只,非否定→不变 de!)", use:"ne…que(只):限制而非否定,后面的冠词保持原样不变 de"},
      {fr:"Il <b>n'</b>y a <b>personne</b>.", zh:"没有人。", use:"ne…personne(没人):personne 作宾语置于动词之后"},
      {fr:"Elle <b>ne</b> fume <b>plus</b> depuis un an.", zh:"她一年前起就不再抽烟了。", use:"ne…plus(不再):过去做、现在不做的事"},
      {fr:"Je <b>ne</b> suis <b>jamais</b> allé en Italie.", zh:"我从没去过意大利。", use:"ne…jamais(从不):复合时态中 jamais 位于助动词与分词之间"},
      {fr:"Je <b>n'</b>ai <b>rien</b> compris.", zh:"我什么都没听懂。", use:"ne…rien(什么都不):复合时态中 rien 位于助动词与分词之间"},
      {fr:"Il <b>n'</b>a <b>aucune</b> idée.", zh:"他毫无头绪。", use:"ne…aucun(e)(没有任何):aucune 与 idée 性数配合,名词用单数"},
      {fr:"<b>Personne n'</b>est venu à la réunion.", zh:"没有人来开会。", use:"rien/personne 作主语:Personne ne + 动词,ne 保留"}
    ],
    tip:"<b>易错:</b>ne…que 是<strong>限制</strong>,后面冠词<strong>不变 de</strong>(对比 ne…pas de)。rien/personne 可作主语:<em>Personne n'est venu.</em>" },

  { id:"b1-connecteurs-base", level:"B1", cat:"逻辑连接(基础)", catFr:"Connecteurs de base",
    title:"Cause, conséquence, but", titleFr:"原因 · 结果 · 目的(基础)",
    zh:"基础逻辑连接:<strong>原因</strong> parce que / car / puisque / comme(句首);<strong>结果</strong> donc / alors / c'est pourquoi;<strong>目的</strong> pour + 原形 / pour que + 虚拟式。(高级连接词见 B2)",
    fr:"Cause : parce que, car, puisque, comme. Conséquence : donc, c'est pourquoi. But : pour (+inf.), pour que (+subj.).",
    ex:[
      {fr:"Je révise <b>parce que</b> j'ai un examen.", zh:"我复习是因为有考试。", use:"原因(parce que):回答『为什么』,引出对方未知的原因"},
      {fr:"Je t'explique <b>pour que</b> tu <b>comprennes</b>.", zh:"我解释给你听,好让你明白。(pour que+虚拟)", use:"目的(pour que+虚拟式):主句与目的从句主语不同时用 pour que"},
      {fr:"<b>Puisque</b> tu es là, aide-moi !", zh:"既然你在这儿,就帮帮我吧!", use:"原因(puisque):引出双方都已知的原因,相当于『既然』"},
      {fr:"<b>Comme</b> il pleuvait, nous sommes restés à la maison.", zh:"由于下雨,我们待在了家里。", use:"原因(comme):表原因时必须放句首,引出已知背景"},
      {fr:"Il est resté chez lui, <b>car</b> il était malade.", zh:"他待在家里,因为他病了。", use:"原因(car):偏书面,连接两个分句,不能放句首"},
      {fr:"Il pleut, <b>donc</b> je prends mon parapluie.", zh:"下雨了,所以我带上伞。", use:"结果(donc):由前一句推出自然结果"},

    tip:"<b>易错:</b>句首 <b>aussi</b> = 「因此」要倒装;句中 aussi = 「也」<strong>不</strong>倒装。口语可用 du coup / donc 替代。" },

      {fr:"<b>Si</b> difficile que ce <b>soit</b>, persévère.", zh:"无论多难,坚持下去。", use:"无论多么…(si/aussi/quelque+形容词+que+虚拟式):si difficile que 表程度让步,后接虚拟式 soit"},
      {fr:"<b>Qui que</b> vous <b>soyez</b>, vous devrez attendre.", zh:"无论您是谁,都得等。", use:"无论谁(qui que+虚拟式):qui que 泛指任何人,后接虚拟式 soyez"},
      {fr:"<b>Où que</b> tu <b>ailles</b>, je te suivrai.", zh:"无论你去哪里,我都跟着你。", use:"无论哪里(où que+虚拟式):où que 泛指任何地点,后接虚拟式 ailles"},
      {fr:"<b>Quoiqu'</b>il <b>soit</b> malade, il travaille. / <b>Quoi qu'</b>il <b>fasse</b>, il échoue.", zh:"尽管他病了,他仍在工作。/ 无论他做什么,都失败。", use:"对比(quoique vs quoi que):quoique 一个词 = bien que『尽管』;quoi que 两个词 = 『无论什么』,均接虚拟式"}
    ],
    tip:"<b>易错:</b><b>quoique</b>(一个词 = bien que,「尽管」)≠ <b>quoi que</b>(两个词 = 「无论什么」)。<b>quel que</b> 分写,quel 与后面主语配合(quelle que soit、quels que soient)。" },

  { id:"c1-hypothese-sans-si", level:"C1", cat:"高级让步与假设", catFr:"Concession et hypothèse",
    title:"L'hypothèse sans « si »", titleFr:"不用 si 表假设",
    zh:"不用 si 表假设:<b>au cas où</b>(+条件式)、<b>à condition de</b>(+原形)/<b>à condition que</b>(+虚拟)、<b>avec/sans</b> + 名词、<b>gérondif</b>(en + 分词)、<b>à supposer que / en admettant que / pour peu que</b>(+虚拟)。",

      {fr:"<b>Au cas où</b> tu <b>aurais</b> faim, il y a du pain.", zh:"万一你饿了,有面包。", use:"au cas où+条件式:表『万一』,后面独特地接条件式 aurais"},
      {fr:"<b>Avec</b> un peu de chance, on y arrivera.", zh:"运气好的话,我们能做到。", use:"avec/sans+名词:介词短语表假设,avec un peu de chance = si on a un peu de chance"},
      {fr:"Je viendrai, <b>à condition que</b> tu me <b>préviennes</b> à l'avance.", zh:"只要你提前通知我,我就来。", use:"à condition que+虚拟式:主从句主语不同用 à condition que + 虚拟式;同主语则用 à condition de + 原形"},

    ],

  // ---------- 虚拟式与配合细节 ----------

      {fr:"Il est plus malin qu'on <b>ne</b> le pense.", zh:"他比人们想的更精明。", use:"不等比较之后:plus/moins/autre…que 引出的比较从句里 ne 为赘词"},

      {fr:"À peine <b>fut-il</b> arrivé qu'on l'appela.", zh:"他刚到就被人叫走了。", use:"à peine…que 倒装:à peine 置于句首触发主谓倒装,先过去时表『刚…就…』"},
      {fr:"<b>Dès que</b> le soleil <b>se fut couché</b>, les invités partirent.", zh:"太阳刚一落山,客人们便离去了。", use:"时间连词从句:dès que 引导的从句用先过去时,代词式动词以 être 的简单过去时作助动词"}
    ],
    tip:"<b>搭配:</b>从句先过去时(先完成)+ 主句简单过去时。口语对应「愈过去时 + 复合过去时」。识别为主。" },

  { id:"c2-concordance-litteraire", level:"C2", cat:"文学时态精通", catFr:"Temps littéraires (maîtrise)",
    title:"La concordance littéraire du subjonctif", titleFr:"虚拟式的文学时态呼应",
    zh:"严格文学语体里,主句过去时 → 从句虚拟式用 <strong>imparfait</strong>(同时)或 <strong>plus-que-parfait</strong>(在前)(现代口语一律用现在时/过去时)。",
    fr:"Concordance soutenue : principale au passé → subjonctif imparfait (simultanéité) ou plus-que-parfait (antériorité).",
    ex:[
      {fr:"Je voulais qu'il <b>vînt</b>.", zh:"我当时想要他来。(现代:qu'il vienne)", use:"虚拟式未完成过去:主句过去时,从句动作与之同时或在后 → imparfait du subjonctif"},
      {fr:"Bien qu'il <b>eût plu</b>, ils sortirent.", zh:"尽管之前下过雨,他们还是出门了。", use:"虚拟式愈过去:从句动作先于主句(先下过雨)→ plus-que-parfait du subjonctif"},
      {fr:"Il craignait qu'elle ne <b>fût</b> déjà loin.", zh:"他担心她已经走远了。(现代:qu'elle ne soit)", use:"虚拟式未完成过去:主句 imparfait,从句同时的状态用 fût,现代法语作 soit"}
    ],
    tip:"<b>现状:</b>仅在很正式/文学写作里这样配;日常用虚拟式现在时即可。C2 要求<strong>读懂并能识别</strong>。" },

  // ---------- 高级让步与虚拟 ----------
  { id:"c2-concession-soutenue", level:"C2", cat:"高级让步与虚拟", catFr:"Concession et subjonctif fins",
    title:"La concession soutenue", titleFr:"高级让步结构 ⭐",
    zh:"<b>quand bien même</b>(+条件式,即便)、<b>n'était / n'eût été</b>(+名词,若非)、<b>encore que</b>(+虚拟,虽然)、<b>tout + 形容词 + que</b>(+直陈,尽管)、<b>pour autant que</b>(+虚拟,就…而言)。",
    fr:"Concession soutenue : quand bien même (+cond.), n'était (+nom), encore que (+subj.), tout… que (+ind.).",
    ex:[
      {fr:"<b>Quand bien même</b> il pleuvrait, je sortirais.", zh:"即便下雨,我也会出门。", use:"quand bien même:后接条件式,表『即便』的假设性让步"},
      {fr:"<b>N'était</b> son aide, j'aurais échoué.", zh:"若非他的帮助,我早就失败了。", use:"n'était:后接名词,表『若非』,动词凝固为 n'était / n'eût été"},
      {fr:"<b>Tout</b> intelligent <b>qu'</b>il est, il se trompe.", zh:"他再聪明也会出错。", use:"tout…que:后接直陈式,强调让步的内容是既成事实"},
      {fr:"<b>N'eût été</b> la tempête, nous serions arrivés à temps.", zh:"若非那场风暴,我们本会准时到达。", use:"n'était:文学变体 n'eût été 表对过去情形的『若非』"},
      {fr:"Le projet est solide, <b>encore qu'</b>il <b>faille</b> vérifier certains chiffres.", zh:"这个方案很扎实,虽然某些数字还需核实。", use:"encore que:后接虚拟式,表事后补充的让步"},
      {fr:"<b>Pour autant que</b> je <b>sache</b>, rien n'a changé.", zh:"就我所知,一切都没有变。", use:"pour autant que:后接虚拟式,表『就…而言』的限定性让步"}
    ],
    tip:"<b>关键:</b>quand bien même + <strong>条件式</strong>;tout… que + <strong>直陈式</strong>(强调事实);encore que + <strong>虚拟式</strong>。" },

  { id:"c2-subj-fin", level:"C2", cat:"高级让步与虚拟", catFr:"Concession et subjonctif fins",
    title:"Les emplois fins du subjonctif", titleFr:"虚拟式的细微用法 ⭐",
    zh:"<b>non que</b>(+虚拟,并非因为)、<b>le fait que</b>(常+虚拟)、<b>de sorte que</b>(<strong>目的</strong>+虚拟 / <strong>结果</strong>+直陈,意义不同!)、<b>soit que… soit que</b>(+虚拟)、<strong>最高级 / le seul / le premier + qui</strong>(+虚拟,表主观)。",
    fr:"Nuances : non que (+subj.), de sorte que (but→subj. / conséquence→ind.), le seul qui… (+subj.).",
    ex:[
      {fr:"<b>Non qu'</b>il <b>soit</b> bête, mais il est distrait.", zh:"并非他笨,而是他心不在焉。", use:"non que:否定一个想当然的原因,后接虚拟式"},
      {fr:"Parle fort <b>de sorte qu'</b>on t'<b>entende</b>.", zh:"大声说,以便别人听见。(目的→虚拟)", use:"de sorte que 表目的:尚未实现的目标 → 虚拟式(entende)"},
      {fr:"C'est le seul qui <b>sache</b> la vérité.", zh:"他是唯一知道真相的人。", use:"最高级/le seul + qui:表主观评价,关系从句用虚拟式"},
      {fr:"Il parlait très bas, <b>de sorte que</b> personne ne l'<b>entendait</b>.", zh:"他说话声音很低,结果谁也听不见。(结果→直陈)", use:"de sorte que 表结果:陈述实际发生的结果 → 直陈式"},
      {fr:"<b>Le fait qu'</b>il <b>soit</b> parti sans prévenir m'inquiète.", zh:"他不辞而别这件事让我担心。", use:"le fait que:置于句首作主语时常接虚拟式"},
      {fr:"<b>Soit qu'</b>il <b>ait</b> oublié, <b>soit qu'</b>il n'<b>ait</b> pas osé, il s'est tu.", zh:"或是忘了,或是不敢,他什么也没说。", use:"soit que… soit que:列举两个可能的原因,均接虚拟式"}
    ],
    tip:"<b>对比:</b>de sorte que 表<strong>目的</strong>→虚拟、表<strong>结果</strong>→直陈(…, de sorte qu'on l'entendait)。最高级 + qui 用虚拟表主观判断。" },

  // ---------- 配合极难情形 ----------
  { id:"c2-accord-extreme", level:"C2", cat:"配合极难情形", catFr:"Accords extrêmes",
    title:"L'accord du participe : cas extrêmes", titleFr:"过去分词配合(极难情形)⭐",
    zh:"① 代词式动词中 se 是<strong>间接</strong>宾语 → <strong>不配合</strong>:se succéder / se plaire / se nuire / se parler / se ressembler(elles se sont <b>succédé</b>);② <b>coûté / pesé / valu / vécu / couru</b> 作<strong>本义</strong>(数量)不配合,<strong>引申义</strong>配合;③ <b>ci-joint / excepté / vu / passé</b> 置于名词<strong>前</strong>不配合。",
    fr:"se succéder/plaire/nuire (se = COI → invariable) ; coûté/pesé/valu (sens propre → invariable) ; ci-joint antéposé → invariable.",
    ex:[
      {fr:"Les rois qui se sont <b>succédé</b>.", zh:"相继即位的国王们。(se = à qn → 不配合)", use:"se=间接宾语不配合:succéder à qn → se 为 COI,分词永不配合"},
      {fr:"Veuillez trouver <b>ci-joint</b> la facture.", zh:"随附发票,请查收。(前置→不配合)", use:"ci-joint 前置不配合:置于名词 la facture 之前 → 不变"},
      {fr:"Les sommes que ce projet a <b>coûté</b>.", zh:"这个项目花掉的钱。(本义→不配合)", use:"coûté 等本义不配合:coûter 本义(价钱数量)→ les sommes 非真正 COD,不配合"},
      {fr:"Les efforts que ce travail m'a <b>coûtés</b>.", zh:"这项工作让我付出的种种努力。(引申义→配合)", use:"coûté 等引申义配合:coûter 引申为『使付出』时 efforts 是真正 COD → 提前须配合"},
      {fr:"Elles se sont <b>plu</b> dès leur première rencontre.", zh:"她们初次见面就互相投缘。", use:"se=间接宾语不配合:plaire à qn → se 为 COI,分词不变"},
      {fr:"Veuillez signer la déclaration <b>ci-jointe</b>.", zh:"请在随附的声明上签字。(后置→配合)", use:"ci-joint 前置不配合:对照情形——后置作形容词时须与 déclaration 配合"}
    ],
    tip:"<b>判断:</b>se succéder = succéder <b>à</b> qn → se 是间接宾语 → 不配合。ci-joint 前置不配合、后置配合。" },

  // ---------- 风格与倒装 ----------
  { id:"c2-inversion-style", level:"C2", cat:"风格与倒装", catFr:"Style et inversion",

    zh:"文学/正式语体的主语后置:引述语(« … », <b>dit-il</b>)、地点状语句首(<b>Sur la colline se dressait</b> un château)、关系从句中(la ville <b>où vivait</b> ma grand-mère)。",
    fr:"Postposition du sujet : incises (dit-il), complément en tête (Au loin s'étendait la mer), relatives.",
    ex:[
      {fr:"« Je viendrai », <b>répondit-elle</b>.", zh:"「我会来」,她答道。", use:"引述语后置:直接引语后的插入语(incise)中主语与动词倒装"},
      {fr:"Au loin <b>s'étendait</b> la mer.", zh:"远处,大海绵延展开。", use:"状语句首后置:地点状语置于句首,名词主语移至动词之后"},
      {fr:"Ainsi <b>parlait</b> le sage.", zh:"智者如是说。", use:"状语句首后置:ainsi 等副词开头的文学句式引起主语后置"},
      {fr:"Il retourna dans la ville <b>où vivait</b> sa grand-mère.", zh:"他回到了祖母生活过的那座城市。", use:"关系从句后置:où 引导的从句中,短动词 + 名词主语常后置以求句子平衡"}
    ],
    tip:"<b>用途:</b>状语/补语置于句首时,书面常将主语后置以求文雅或句子平衡;口语不必。" },

  { id:"c2-ellipse", level:"C2", cat:"风格与倒装", catFr:"Style et inversion",
    title:"L'ellipse et la concision", titleFr:"省略与凝练(高级书面)",

    fr:"Le style soutenu recourt à l'ellipse (omission d'éléments récupérables) pour la concision.",
    ex:[

      {fr:"<b>Inutile d'</b>insister.", zh:"不必坚持了。(= Il est inutile d'insister.)", use:"省略非人称主语:省去 Il est,仅留形容词 + de + 原形"},
      {fr:"<b>À chacun</b> son métier.", zh:"各司其职。(格言式省略)", use:"格言式省略:格言/成句中整个动词省去,凝练有力"},

  // ---------- 情态与推测 ----------
  { id:"c2-conjecture", level:"C2", cat:"情态与推测", catFr:"Modalisation",
    title:"Le futur et le conditionnel de conjecture", titleFr:"推测性将来时/条件式 ⭐",
    zh:"用时态表<strong>推测</strong>而非时间:<b>futur de conjecture</b>(多半…:Il <b>sera</b> malade = 他大概病了);<b>conditionnel</b> 表<strong>未经证实</strong>(新闻:Il y <b>aurait</b> des victimes = 据称有伤亡);devoir / pouvoir 表情态推测。",
    fr:"Le futur/conditionnel peut exprimer la conjecture (probabilité, information non confirmée).",
    ex:[

      {fr:"Selon la presse, le bilan <b>s'élèverait</b> à dix morts.", zh:"据媒体,死亡人数或达十人。", use:"新闻条件式:conditionnel 表示消息未经证实,常见于新闻报道"},
      {fr:"Il <b>doit</b> être déjà parti.", zh:"他想必已经走了。", use:"情态动词推测:devoir + 原形表『想必/应该』的推断"},

      {fr:"Il <b>a pu</b> manquer son train.", zh:"他可能是误了火车。", use:"情态动词推测:pouvoir 表比 devoir 更弱的可能性推断"}
    ],
    tip:"<b>阅读信号:</b>新闻里的条件式 = 「据称/有待证实」,是阅读理解的重要信号词;别理解成普通假设。" },

  // ---------- 词法与衔接 ----------
  { id:"c2-rection", level:"C2", cat:"词法与篇章衔接", catFr:"Rection et cohésion",

    zh:"换介词即换义:<b>tenir à</b>(珍视/坚持)vs <b>tenir de</b>(像/源自);<b>jouer à</b>(玩运动)vs <b>jouer de</b>(演奏乐器);<b>manquer à</b>(使想念)vs <b>manquer de</b>(缺);<b>il s'agit de</b>(涉及)、<b>en vouloir à</b>(怪罪)。",
    fr:"La préposition change le sens : tenir à/de, jouer à/de, manquer à/de, en vouloir à, il s'agit de.",
    ex:[
      {fr:"Je <b>tiens à</b> toi. / Il <b>tient de</b> son père.", zh:"我在乎你。/ 他像他父亲。", use:"tenir à/de:tenir à = 珍视/坚持,tenir de = 像/源自,介词决定词义"},
      {fr:"Elle <b>joue du</b> piano et <b>au</b> tennis.", zh:"她弹钢琴、打网球。", use:"jouer à/de:jouer de + 乐器,jouer à + 运动或游戏"},
      {fr:"Tu me <b>manques</b>.", zh:"我想你。(manquer à 的特殊语序!)", use:"manquer à:『使想念』,主语是被想念的人,与中文主宾相反"},
      {fr:"Ce discours <b>manque de</b> conviction.", zh:"这篇演说缺乏说服力。", use:"manquer de:『缺乏』+ 名词,与 manquer à 意义迥异"},
      {fr:"Dans ce roman, il <b>s'agit d'</b>une vengeance familiale.", zh:"这部小说讲的是一场家族复仇。", use:"il s'agit de:非人称固定结构,主语永远是 il,表『涉及/讲的是』"},
      {fr:"Ne m'<b>en veux pas</b>, je ne l'ai pas fait exprès.", zh:"别怪我,我不是故意的。", use:"en vouloir à:固定短语『怪罪某人』,en 已凝固在结构中"}
    ],
    tip:"<b>高频错点:</b>「我想你」= <b>Tu me manques</b>(字面:你对我而言缺失),主宾与中文相反。" },

  { id:"c2-cause-niee", level:"C2", cat:"词法与篇章衔接", catFr:"Rection et cohésion",

      {fr:"<b>Ce n'est pas que</b> je n'aime pas, <b>c'est que</b> je n'ai pas le temps.", zh:"不是我不喜欢,而是我没时间。", use:"ce n'est pas que…c'est que:『不是…而是…』的否定—修正原因框架"},
      {fr:"Elle se tait, <b>non pas qu'</b>elle <b>ait</b> peur, <b>mais parce qu'</b>elle réfléchit.", zh:"她沉默着,并非因为害怕,而是因为在思考。", use:"non que…mais:变体 non pas que 同样接虚拟式,后接 mais parce que 引出真因"}
    ],

  { id:"c2-cohesion", level:"C2", cat:"词法与篇章衔接", catFr:"Rection et cohésion",
    title:"Les marqueurs de cohésion de haut niveau", titleFr:"高阶篇章衔接词 ⭐",
    zh:"<b>or</b>(然而,引入新论据)、<b>au demeurant</b>(再者/不过)、<b>en l'occurrence</b>(具体而言/就此而言)、<b>partant</b>(因而)、<b>cela étant</b>(话虽如此)、<b>quoi qu'il en soit</b>(无论如何)、<b>à cet égard</b>(在这方面)。",
    fr:"Connecteurs de haut niveau : or, au demeurant, en l'occurrence, partant, cela étant, quoi qu'il en soit, à cet égard.",
    ex:[

      {fr:"<b>En l'occurrence</b>, il avait raison.", zh:"就此事而言,他是对的。", use:"en l'occurrence:『就此事而言』,把一般论断落到具体情形"},
      {fr:"Le projet coûte cher ; <b>cela étant</b>, il est nécessaire.", zh:"项目很贵;话虽如此,它是必要的。", use:"cela étant:『话虽如此』,承认前述事实后引出转折"},

      {fr:"Le style est dense, <b>au demeurant</b> élégant.", zh:"文风紧凑,而且不失优雅。", use:"au demeurant:『再者/不过』,补充一个略带转折的评价"},
      {fr:"La demande recule ; <b>partant</b>, les prix baissent.", zh:"需求回落;因而价格下降。", use:"partant:文语『因而』,以前句为因引出结果"},
      {fr:"<b>À cet égard</b>, aucune décision n'a encore été prise.", zh:"在这方面,尚未做出任何决定。", use:"à cet égard:『在这方面』,限定论述所指的方面"}
    ],

  { id:"c2-exclamation", level:"C2", cat:"词法与篇章衔接", catFr:"Rection et cohésion",
    title:"Tournures exclamatives soutenues", titleFr:"文学感叹与强调句式",
    zh:"<b>Que de…!</b>(多么多…!)、<b>Que ne…!</b>(怎么不…/真该…,文学)、<b>Combien…!</b>,以及比较从句中的文学性 <b>ne</b>。",
